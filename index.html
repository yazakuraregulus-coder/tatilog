<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e6f5c">
<meta name="mobile-web-app-capable" content="yes">
<title>たびログ（試作）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root { --main:#1e6f5c; --accent:#f0a500; --bg:#f4f6f5; --text:#222; --muted:#6b7570; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { background:var(--main); color:#fff; padding:10px 14px calc(10px) ; padding-top:calc(10px + env(safe-area-inset-top)); }
  .hrow { display:flex; justify-content:space-between; align-items:baseline; }
  .title { font-weight:700; font-size:17px; }
  .lv { font-size:15px; } .lv b { font-size:22px; }
  .bar { height:8px; background:rgba(255,255,255,.25); border-radius:4px; margin-top:6px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .6s; }
  .xptext { font-size:11px; opacity:.85; margin-top:3px; text-align:right; }
  #map { flex:1; min-height:240px; }
  .panel { background:#fff; padding:12px 14px; box-shadow:0 -2px 8px rgba(0,0,0,.08); z-index:500; }
  #place { font-size:22px; font-weight:700; }
  #pref { font-size:13px; color:var(--muted); }
  .status { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .new { background:#ffe9b3; color:#8a5a00; } .old { background:#e3efe9; color:var(--main); }
  #sub { font-size:12px; color:var(--muted); margin:4px 0 10px; min-height:1em; }
  button { font:inherit; border:none; border-radius:10px; padding:12px; cursor:pointer; }
  #checkin { width:100%; background:var(--accent); color:#fff; font-size:18px; font-weight:700; }
  #checkin:disabled { background:#c9cfcc; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row button { flex:1; background:#e3efe9; color:var(--main); font-size:14px; }
  .row button.on { background:#d33; color:#fff; }
  details { background:#fff; border-top:1px solid #e5e5e5; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); max-height:40vh; overflow:auto; }
  summary { font-weight:700; cursor:pointer; }
  .pref-h { margin:10px 0 4px; font-size:13px; color:var(--main); font-weight:700; }
  .muni { font-size:14px; padding:3px 0; display:flex; justify-content:space-between; border-bottom:1px dotted #ddd; }
  .muni span { color:var(--muted); font-size:12px; }
  .spot { margin-top:10px; padding:10px; border:2px solid #7b4fc9; border-radius:12px; background:#f5f0fd; }
  .spot[hidden] { display:none; }
  .spot-name { font-size:17px; font-weight:700; color:#5a32a3; }
  .spot-sub { font-size:12px; color:var(--muted); margin:2px 0 8px; }
  .spot .status.new { background:#e6dbfa; color:#5a32a3; }
  #spotCheckin { width:100%; background:#7b4fc9; color:#fff; font-size:16px; font-weight:700; }
  #spotCheckin:disabled { background:#c9cfcc; }
  .spot-hint { font-size:12px; color:#5a32a3; margin-top:8px; min-height:1em; }
  .spot-marker { background:#fff; border:2px solid #7b4fc9; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; }
  .spot-marker.t-temple span { color:#b3261e; font-weight:700; font-size:17px; }
  .spot-marker.visited { border-color:#9aa39f; filter:grayscale(1); opacity:.6; }
  .spot-cluster { background:#7b4fc9; color:#fff; border:3px solid rgba(255,255,255,.9); border-radius:50%;
    box-shadow:0 1px 5px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; }
  .spot-cluster.visited { background:#9aa39f; }
  /* 観光地のフキダシ（タップで詳細） */
  .spot-pop { cursor:pointer; text-align:center; }
  .spot-pop b { display:block; font-size:14px; }
  .spot-pop span { font-size:11px; color:#7b4fc9; }
  .leaflet-popup-content { margin:8px 12px; }
  /* 観光地の詳細カード */
  .detail { position:fixed; inset:0; z-index:1500; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; }
  .detail[hidden] { display:none; }
  .detail-card { background:#fff; width:100%; max-width:520px; border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto; }
  .detail-head { display:flex; gap:12px; align-items:center; }
  .detail-icon { width:48px; height:48px; flex:none; border:2px solid #7b4fc9; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:26px; }
  .detail-icon.t-temple { color:#b3261e; font-weight:700; }
  .detail-name { font-size:19px; font-weight:700; }
  .detail-type { font-size:12px; color:var(--muted); }
  .detail-desc { font-size:14px; line-height:1.7; margin:12px 0; }
  .detail-rows { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:14px;
    background:var(--bg); border-radius:10px; padding:10px 12px; }
  .detail-rows dt { color:var(--muted); }
  .detail-rows dd { margin:0; font-weight:700; }
  .detail-route { flex:1; display:flex; align-items:center; justify-content:center; border-radius:10px; padding:12px;
    background:#7b4fc9; color:#fff; text-decoration:none; font-size:14px; font-weight:700; }
  .detail-route[hidden] { display:none; }
  .memo { margin-top:12px; }
  .memo label { font-size:13px; font-weight:700; }
  .memo textarea { width:100%; margin-top:4px; font:inherit; font-size:14px; padding:8px 10px;
    border:1px solid #cfd6d3; border-radius:10px; resize:vertical; }
  .memo textarea:disabled { background:var(--bg); }
  .memo-info { font-size:11px; color:var(--muted); min-height:1.2em; margin-top:2px; text-align:right; }
  .spot-item { cursor:pointer; }
  /* 駅の案内カード */
  .spot.st { border-color:#1F5FB0; background:#eef4fc; }
  .spot.st .spot-name { color:#1F5FB0; }
  .spot.st .status.new { background:#d6e4f7; color:#1F5FB0; }
  #stCheckin { width:100%; background:#1F5FB0; color:#fff; font-size:16px; font-weight:700; }
  #stCheckin:disabled { background:#c9cfcc; }
  .st-lines { margin-top:2px; }
  .line-chip { display:inline-flex; align-items:center; gap:3px; font-size:11px; margin:2px 6px 0 0; white-space:nowrap; }
  .line-chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  /* 駅の表示ON/OFFボタン（地図の右上） */
  .map-toggle { background:#fff; border:2px solid rgba(0,0,0,.2); border-radius:8px; padding:6px 10px;
    font-size:13px; font-weight:700; color:#1F5FB0; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .map-toggle.off { color:var(--muted); }
  .map-toggle small { display:block; font-size:10px; font-weight:400; color:var(--muted); }
  .st-pop { text-align:center; }
  .st-pop b { display:block; font-size:14px; }
  .st-pop span { font-size:11px; color:var(--muted); }
  /* コンプリート一覧（県ごと・路線ごと） */
  .comp { border-bottom:1px dotted #ddd; }
  .comp summary { list-style:none; display:flex; align-items:center; gap:8px; padding:6px 0; font-weight:400; font-size:14px; }
  .comp summary::-webkit-details-marker { display:none; }
  .comp summary::before { content:'▸'; color:var(--muted); font-size:11px; }
  .comp[open] summary::before { content:'▾'; }
  .comp .c-name { flex:1; display:flex; align-items:center; gap:5px; }
  .comp .c-num { font-size:12px; color:var(--muted); white-space:nowrap; }
  .comp .c-num.done { color:var(--main); font-weight:700; }
  .c-bar { width:70px; height:6px; background:#e5e9e7; border-radius:3px; overflow:hidden; flex:none; }
  .c-bar > div { height:100%; background:#7b4fc9; }
  .comp .muni { padding-left:16px; }
  .comp .muni.todo { color:var(--muted); }
  .list-note { font-size:11px; color:var(--muted); margin:2px 0 4px; }
  .list-h { margin:14px 0 2px; font-size:14px; font-weight:700; }
  .backup-info { font-size:11px; color:var(--muted); margin-top:4px; }
  .reset { margin-top:12px; background:none; color:#b33; font-size:12px; padding:4px; }
  #toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%) scale(.8); opacity:0;
    background:rgba(0,0,0,.85); color:#fff; padding:18px 24px; border-radius:14px; text-align:center;
    z-index:2000; pointer-events:none; transition:all .25s; min-width:200px; }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast .big { font-size:26px; font-weight:700; color:var(--accent); }
  .demo-banner { display:none; background:#d33; color:#fff; font-size:12px; text-align:center; padding:4px; }
  body.demo .demo-banner { display:block; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="title">🗾 たびログ</div>
    <div class="lv">Lv <b id="lv">1</b></div>
  </div>
  <div class="bar"><div id="barfill"></div></div>
  <div class="xptext" id="xptext">0 XP</div>
</header>
<div class="demo-banner">テストモード：地図をタップした場所にいることにします（記録は保存されません）</div>
<div id="map"></div>
<section class="panel">
  <div><span id="place">現在地を取得中…</span><span id="status"></span></div>
  <div id="pref"></div>
  <div id="sub"></div>
  <button id="checkin" disabled>チェックイン</button>
  <div id="spotBox" class="spot" hidden>
    <div><span id="spotName" class="spot-name"></span><span id="spotStatus"></span></div>
    <div id="spotSub" class="spot-sub"></div>
    <button id="spotCheckin">観光地チェックイン</button>
  </div>
  <div id="stBox" class="spot st" hidden>
    <div><span id="stName" class="spot-name"></span><span id="stStatus"></span></div>
    <div id="stLines" class="st-lines"></div>
    <div id="stSub" class="spot-sub"></div>
    <button id="stCheckin">駅チェックイン</button>
  </div>
  <div id="spotHint" class="spot-hint"></div>
  <div class="row">
    <button id="locate">📍 現在地を更新</button>
    <button id="demo">🧪 テストモード</button>
  </div>
</section>
<details id="list">
  <summary>訪問済み 市町村：<span id="count">0</span> ／ 観光地：<span id="spotCount">0</span> ／ 駅：<span id="stCount">0</span></summary>
  <div id="visited"></div>
  <div id="spotList"></div>
  <div id="stationList"></div>
  <div class="row">
    <button id="export">💾 ファイルに保存</button>
    <button id="import">📂 読み込む</button>
  </div>
  <input type="file" id="importFile" hidden>
  <div class="backup-info" id="backupInfo"></div>
  <button class="reset" id="reset">記録をすべて消す</button>
</details>
<div id="detail" class="detail" hidden>
  <div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="dName">
    <div class="detail-head">
      <div id="dIcon" class="detail-icon"></div>
      <div>
        <div id="dName" class="detail-name"></div>
        <div id="dType" class="detail-type"></div>
      </div>
    </div>
    <p id="dDesc" class="detail-desc"></p>
    <dl class="detail-rows">
      <dt>状態</dt><dd id="dStatus"></dd>
      <dt>初訪問日</dt><dd id="dFirst"></dd>
      <dt>最終訪問日</dt><dd id="dLast"></dd>
      <dt>訪問回数</dt><dd id="dCount"></dd>
      <dt>獲得XP</dt><dd id="dXp"></dd>
      <dt>現在地から</dt><dd id="dDist"></dd>
    </dl>
    <div class="memo">
      <label for="dMemo">📝 思い出メモ</label>
      <textarea id="dMemo" rows="3" maxlength="500"></textarea>
      <div id="dMemoInfo" class="memo-info"></div>
    </div>
    <div class="row">
      <a id="dRoute" class="detail-route" target="_blank" rel="noopener">🗺️ 行き方を見る</a>
      <button id="dClose">閉じる</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>var GSI = {};</script>
<script src="https://maps.gsi.go.jp/js/muni.js"></script>
<script>
// ===== 設定 =====
const XP_NEW = 100;      // 初めての市町村
const XP_REVISIT = 10;   // 再訪（1日1回）
const LOOKUP_MOVE_M = 150; // この距離以上動いたら市町村を調べ直す
const MAX_ACC_M = 200;     // GPS精度がこれより悪いときはチェックインできない
const RETRY_MS = 10000;    // 市町村の判定に失敗したときの再試行間隔（失敗が続くと倍々に延ばす）
const RETRY_MAX_MS = 120000; // 再試行間隔の上限
const STORE_KEY = 'tabilog-v1';
const BACKUP_KEY = 'tabilog-last-backup'; // 最後にファイルへ保存した日
const XP_SPOT_NEW = 50;      // 初めての観光地
const XP_SPOT_REVISIT = 5;   // 観光地の再訪（1日1回）
const SPOT_RADIUS_M = 200;   // 観光地からこの距離以内ならチェックインできる
const SPOT_HINT_M = 10000;   // この距離以内の観光地は「近くの観光地」として案内する
const XP_STATION_NEW = 20;      // 初めての駅
const XP_STATION_REVISIT = 2;   // 駅の再訪（1日1回）
const STATION_RADIUS_M = 150;   // 駅（ホーム）からこの距離以内ならチェックインできる
const STATION_MIN_ZOOM = 13;    // ここまで拡大したときだけ地図に駅を表示する
const STATIONS_URL = 'stations.json';            // 駅データ（必要になったときに読み込む）
const SHOW_STATIONS_KEY = 'tabilog-show-stations'; // 駅の表示ON/OFF（この端末だけの設定）
const MAX_SPEED_KMH = 10;       // 観光地・駅は、これより速く動いているとチェックインできない（電車での通過を防ぐ）
const SPEED_WINDOW_MS = 5000;   // GPSが速度を返さないときは、この時間以上前の位置との差から速度を計算する
const STILL_AFTER_MS = 6000;    // 位置の更新がこの時間なければ「止まっている」とみなす
// 都道府県の並び順（一覧の表示用）
const PREF_ORDER = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県',

const SPOT_TYPE_OTHER = { icon: '📍', label: '観光地' };
const spotType = s => (s && SPOT_TYPES[s.type]) || SPOT_TYPE_OTHER;

// ===== 保存データ =====
let state = load();
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  s = s || { xp: 0, visited: {} };
  s.spots = s.spots || {}; // 観光地の記録（古いデータには無いので補う）
  s.stations = s.stations || {}; // 駅の記録（同上）
  return s;
}
// テストモード中は保存しない。記録が変わったので一覧は作り直す
let listDirty = true;
function save() { listDirty = true; if (demo) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

// ===== レベル計算（Lv2=100, Lv3=300, Lv4=600 …） =====
const needXp = L => 50 * (L - 1) * L;
function levelOf(xp) { let L = 1; while (xp >= needXp(L + 1)) L++; return L; }

// ===== 地図 =====
const map = L.map('map', { zoomControl: false }).setView([35.681, 139.767], 13);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'
}).addTo(map);
// 現在地の点は観光地のアイコンより上に出す
map.createPane('me').style.zIndex = 650;
const marker = L.circleMarker([0, 0], { pane: 'me', radius: 8, color: '#fff', weight: 3, fillColor: '#1e6f5c', fillOpacity: 1 });
const accCircle = L.circle([0, 0], { radius: 0, color: '#1e6f5c', weight: 1, fillOpacity: 0.1 });

// 観光地の印（種類ごとのアイコン。未訪問は紫の枠、訪問済みは灰色）
function spotIcon(s, visited) {
  return L.divIcon({
    className: `spot-marker t-${s.type || 'other'}${visited ? ' visited' : ''}`,
    html: `<span>${spotType(s).icon}</span>`,
    iconSize: [30, 30], iconAnchor: [15, 15], tooltipAnchor: [0, -15],
  });
}
// 近くにある観光地は数字付きの丸にまとめる（Leaflet.markercluster）。
// 読み込みに失敗したときは、まとめずにそのまま地図に置く
const spotLayer = L.markerClusterGroup
  ? L.markerClusterGroup({
      maxClusterRadius: 45,          // この画面上の距離（px）以内の印をまとめる
      disableClusteringAtZoom: 14,   // ここまで拡大したら全部ばらして表示する
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: false,
      iconCreateFunction: cluster => {
        const ms = cluster.getAllChildMarkers();
        const allVisited = ms.every(m => m.visited);
        const size = ms.length < 10 ? 34 : ms.length < 100 ? 40 : 46;
        return L.divIcon({
          className: 'spot-cluster' + (allVisited ? ' visited' : ''),
          html: `<span>${ms.length}</span>`,
          iconSize: [size, size],
        });
      },
    })
  : L.layerGroup();
spotLayer.addTo(map);

const spotMarkers = {};
SPOTS.forEach(s => {
  // タップすると名前のフキダシ、フキダシをタップすると詳細カード
  const m = L.marker([s.lat, s.lng], { icon: spotIcon(s, false) })
    .bindPopup(`<div class="spot-pop"><b>${spotType(s).icon} ${esc(s.name)}</b><span>タップで詳細 ›</span></div>`,
      { closeButton: false, offset: [0, -10], autoPanPadding: [20, 20] })
    .addTo(spotLayer);
  m.on('popupopen', e => {
    e.popup.getElement().querySelector('.spot-pop').onclick = () => { m.closePopup(); openSpotDetail(s.id); };
  });
  m.visited = false;
  m.on('click', () => { if (demo) setPosition(s.lat, s.lng, 0, true); }); // テストモードではアイコンをタップするとその場所へ
  spotMarkers[s.id] = m;
});

// ===== 駅（stations.json を必要になったときに読み込む） =====
let STATIONS = null;              // [{ id, name, pref, city, lat, lng, lines:[路線id], p:[[lat,lng],…]? }]
let LINES = [];                   // [{ id, label, color, st:[駅id] }]
let STATION_AREA = '';            // データに入っている範囲（例：群馬県）
const stationIndex = {}, lineIndex = {};
let stationsLoading = null, stationsFailedAt = 0;
function loadStations() {
  if (STATIONS || stationsLoading) return;
  if (Date.now() - stationsFailedAt < 30000) return; // 失敗したら30秒は再挑戦しない
  stationsLoading = fetch(STATIONS_URL, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      LINES = d.lines || [];
      LINES.forEach(l => { lineIndex[l.id] = l; });
      (d.stations || []).forEach(s => { stationIndex[s.id] = s; });
      STATIONS = d.stations || [];
      STATION_AREA = d.area || '';
      map.attributionControl.addAttribution('駅：<a href="https://nlftp.mlit.go.jp/ksj/" target="_blank">国土数値情報（鉄道データ）</a>を加工');
      listDirty = true;
      refreshStationLayer();
      render();
    })
    .catch(e => { stationsFailedAt = Date.now(); console.warn('駅データを読み込めませんでした', e); })
    .finally(() => { stationsLoading = null; });
}
const stationColor = st => (lineIndex[st.lines[0]] || {}).color || '#555';
const lineChips = st => st.lines.map(id => lineIndex[id])
  .filter(Boolean).map(l => `<span class="line-chip"><i style="background:${esc(l.color)}"></i>${esc(l.label)}</span>`).join('');

// 駅の点は数が多いので、軽い canvas で「路線の色の小さな丸」として描く。
// 拡大したとき（STATION_MIN_ZOOM 以上）に、画面に入っている駅だけ描く
const stationRenderer = L.canvas({ padding: 0.3 });
const stationLayer = L.layerGroup().addTo(map);
let showStations = true;
try { showStations = localStorage.getItem(SHOW_STATIONS_KEY) !== '0'; } catch (e) {}
let stationSig = '';
function refreshStationLayer() {
  stationLayer.clearLayers();
  updateStationToggle();
  if (!STATIONS || !showStations || map.getZoom() < STATION_MIN_ZOOM) return;
  const b = map.getBounds().pad(0.3);
  STATIONS.forEach(st => {
    if (!b.contains([st.lat, st.lng])) return;
    const v = state.stations[st.id], color = stationColor(st);
    // 未訪問：路線の色で塗りつぶし ／ 訪問済み：白抜き（路線の色の太い縁）
    const m = L.circleMarker([st.lat, st.lng], v
      ? { renderer: stationRenderer, radius: 6, color, weight: 3, fillColor: '#fff', fillOpacity: 1, bubblingMouseEvents: false }
      : { renderer: stationRenderer, radius: 6, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1, bubblingMouseEvents: false });
    m.bindPopup(`<div class="st-pop"><b>🚉 ${esc(st.name)}駅</b><div>${lineChips(st)}</div>` +
      `<span>${v ? `✅ 訪問済み ${v.count}回` : '未訪問'}</span></div>`, { closeButton: false, offset: [0, -4] });
    m.on('click', () => { if (demo) setPosition(st.lat, st.lng, 0, true); }); // テストモードではタップした駅にいることにする
    m.addTo(stationLayer);
  });
}
map.on('moveend', refreshStationLayer);

// 地図右上の「駅」表示ON/OFFボタン
let stationToggleBtn = null;
const StationToggle = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const b = L.DomUtil.create('button', 'map-toggle');
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener('click', () => {
      showStations = !showStations;
      try { localStorage.setItem(SHOW_STATIONS_KEY, showStations ? '1' : '0'); } catch (e) {}
      if (showStations) loadStations();
      refreshStationLayer();
    });
    stationToggleBtn = b;
    return b;
  },
});
map.addControl(new StationToggle());
function updateStationToggle() {
  const b = stationToggleBtn;
  if (!b) return;
  b.classList.toggle('off', !showStations);
  b.innerHTML = showStations
    ? '🚉 駅：ON' + (map.getZoom() < STATION_MIN_ZOOM ? '<small>拡大すると表示</small>' : '')
    : '🚉 駅：OFF';
}
updateStationToggle();

function startWatch() {
  if (!window.isSecureContext) {
    showPlace('HTTPSで開いてください', '', '位置情報は https:// のページでしか使えません。テストモードなら試せます。');
    return;
  }
  if (!navigator.geolocation) { showPlace('位置情報に未対応', '', ''); return; }
  stopWatch();
  $('sub').textContent = 'GPSを探しています…';
  watchId = navigator.geolocation.watchPosition(
    p => setPosition(p.coords.latitude, p.coords.longitude, p.coords.accuracy, false, p.coords.speed),
    err => {
      const msg = err.code === 1
        ? '位置情報の利用が許可されていません。Chromeのアドレスバー左のアイコン →「権限」から許可してください。'
        : '位置情報を取得できませんでした（' + err.message + '）';
      $('sub').textContent = msg;
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
  );
}
function stopWatch() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }

// ===== 移動の速さ（電車で通過しただけのチェックインを防ぐ） =====
let fixes = [];          // 最近の位置 { lat, lng, t }
let stillTimer = null;
// GPSが返す速度（m/s）があればそれを使い、無ければ数秒前の位置との差から計算する（km/h。分からなければ null）
function estimateSpeed(lat, lng, gpsSpeed) {
  const now = Date.now();
  fixes.push({ lat, lng, t: now });
  fixes = fixes.filter(f => now - f.t < 30000);
  if (typeof gpsSpeed === 'number' && isFinite(gpsSpeed)) return gpsSpeed * 3.6;
  const old = fixes.filter(f => now - f.t >= SPEED_WINDOW_MS).pop();
  if (!old) return null;
  return L.latLng(lat, lng).distanceTo([old.lat, old.lng]) / ((now - old.t) / 1000) * 3.6;
}
// 今の速さ（km/h）。しばらく位置が更新されていなければ止まっているとみなす
function currentSpeed() {
  if (!current) return null;
  if (current.speed !== null) return current.speed;
  return Date.now() - current.t > STILL_AFTER_MS ? 0 : null;
}
// 観光地・駅のチェックインを止める理由（動いていなければ null）
function movingBlock() {
  if (demo) return null;
  const sp = currentSpeed();
  if (sp === null) return '速度を確認中…';
  if (sp > MAX_SPEED_KMH) return `移動中はチェックインできません（時速約${Math.round(sp)}km）`;
  return null;
}

function setPosition(lat, lng, acc, force, gpsSpeed) {
  const ll = L.latLng(lat, lng);
  marker.setLatLng(ll).addTo(map);
  accCircle.setLatLng(ll).setRadius(acc || 0).addTo(map);
  if (firstFix || demo) { map.setView(ll, Math.max(map.getZoom(), 14)); firstFix = false; }
  const prevMuni = current && current.muni;
  current = { lat, lng, acc, muni: prevMuni, t: Date.now(), speed: demo ? 0 : estimateSpeed(lat, lng, gpsSpeed) };
  // 速さが分からないときは、少し待って位置が変わらなければ「止まっている」として描き直す
  clearTimeout(stillTimer);
  if (current.speed === null) stillTimer = setTimeout(render, STILL_AFTER_MS + 500);
  loadStations(); // 近くの駅を調べるため、駅データを読み込んでおく
  $('sub').textContent = acc ? `GPS精度 約${Math.round(acc)}m` : 'テスト地点';
  if (force || !lastLookup || ll.distanceTo(lastLookup) > LOOKUP_MOVE_M) {
    lastLookup = ll;
    lookup(lat, lng);
  }
  render(); // GPS精度が変わるとチェックインの可否も変わるので毎回更新
}

// ===== 市町村の判定（国土地理院 → だめならOpenStreetMap） =====
async function lookup(lat, lng) {
  const seq = ++lookupSeq;
  clearTimeout(retryTimer);
  lookupPending = true;
  let muni = null;
  try { muni = await lookupGsi(lat, lng); } catch (e) {}
  if (!muni) { try { muni = await lookupOsm(lat, lng); } catch (e) {} }
  if (seq !== lookupSeq) return; // 古い結果は捨てる
  lookupPending = false;
  current.muni = muni;
  if (muni && muni.source === 'gsi') {
    failCount = 0;
  } else {
    // 地理院で判定できなかったら、その場にいても少し待って自動で再試行する
    const wait = Math.min(RETRY_MS * 2 ** failCount, RETRY_MAX_MS);
    failCount++;
    retryTimer = setTimeout(() => {
      if (!current) return;
      lastLookup = L.latLng(current.lat, current.lng);
      lookup(current.lat, current.lng);
    }, wait);
  }
  render();
}

async function lookupGsi(lat, lng) {
  const r = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`);
  const j = await r.json();
  if (!j.results || !j.results.muniCd) return null;
  const code = String(parseInt(j.results.muniCd, 10));
  const entry = GSI.MUNI_ARRAY && GSI.MUNI_ARRAY[code];
  if (!entry) return null;
  const parts = entry.split(',');           // 例: "13,東京都,13104,新宿区"
  const pref = parts[1];
  const names = parts[3].split(/[\s　]+/).filter(Boolean); // 例: ["札幌市","中央区"] / ["石狩郡","当別町"]
  let city = names.join(''), ward = '';
  if (names.length >= 2) {
    if (/郡$/.test(names[0])) city = names[names.length - 1];          // 郡は省いて町村名だけ
    else if (/市$/.test(names[0]) && /区$/.test(names[1])) { city = names[0]; ward = names[1]; } // 政令市は市単位
  }
  return { pref, city, ward, area: j.results.lv01Nm || '', source: 'gsi' };
}

async function lookupOsm(lat, lng) {
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=10&accept-language=ja`);
  const j = await r.json();
  const a = j.address || {};
  const pref = a.province || a.state || '';
  const city = a.city || a.town || a.village || a.municipality || '';
  if (!pref || !city) return null;
  // 地理院と名前の付け方が違うことがあり二重登録の原因になるので、表示専用にする
  return { pref, city, ward: a.city_district || '', area: '', source: 'osm' };
}

// ===== チェックイン =====
const today = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD
const keyOf = m => m.pref + '/' + m.city;

// チェックインできない理由（できるなら null）
function checkinBlock() {
  if (!current || !current.muni) return 'チェックイン';
  const m = current.muni, v = state.visited[keyOf(m)];
  if (m.source !== 'gsi') return '予備の判定中のためチェックイン不可';
  if (!demo && current.acc > MAX_ACC_M) return `GPS精度が低いです（${MAX_ACC_M}m以内で可能）`;
  if (v && v.last === today()) return '今日はチェックイン済み';
  return null;
}

$('checkin').addEventListener('click', () => {
  if (checkinBlock()) return;
  const m = current.muni, k = keyOf(m), v = state.visited[k];
  let gain, title;
  if (!v) {
    gain = XP_NEW; title = '🎉 初訪問！';
    state.visited[k] = { pref: m.pref, city: m.city, first: today(), last: today(), count: 1 };
  } else {
    gain = XP_REVISIT; title = 'おかえりなさい';
    v.last = today(); v.count++;
  }
  const before = levelOf(state.xp);
  state.xp += gain;
  save();
  const after = levelOf(state.xp);
  toast(`${title}<br>${esc(m.city)}<div class="big">+${gain} XP</div>` +
        (after > before ? `<div>⬆ レベルアップ！ Lv${after}</div>` : '') +
        (demo ? '<div style="font-size:12px;opacity:.8">テストモードのため保存されません</div>' : ''));
  render();
});

// ===== 観光地チェックイン =====
// 現在地からいちばん近い観光地と距離（m）
function nearestSpot() {
  if (!current) return null;
  const here = L.latLng(current.lat, current.lng);
  let best = null;
  SPOTS.forEach(s => {
    const d = here.distanceTo([s.lat, s.lng]);
    if (!best || d < best.dist) best = { spot: s, dist: d };
  });
  return best;
}

// 観光地にチェックインできない理由（できるなら null）
function spotBlock(n) {
  if (!n || n.dist > SPOT_RADIUS_M) return '範囲外';
  if (!demo && current.acc > MAX_ACC_M) return `GPS精度が低いです（${MAX_ACC_M}m以内で可能）`;
  const v = state.spots[n.spot.id];
  if (v && v.last === today()) return '今日はチェックイン済み';
  return movingBlock();
}

$('spotCheckin').addEventListener('click', () => {
  const n = nearestSpot();
  if (spotBlock(n)) return;
  const s = n.spot, v = state.spots[s.id];
  let gain, title;
  if (!v) {
    gain = XP_SPOT_NEW; title = '📸 観光地に到着！';
    state.spots[s.id] = { name: s.name, pref: s.pref, city: s.city || '', first: today(), last: today(), count: 1 };
  } else {
    gain = XP_SPOT_REVISIT; title = 'また来ました';
    v.last = today(); v.count++;
  }
  const before = levelOf(state.xp);
  state.xp += gain;
  save();
  const after = levelOf(state.xp);
  toast(`${title}<br>${esc(s.name)}<div class="big">+${gain} XP</div>` +
        (after > before ? `<div>⬆ レベルアップ！ Lv${after}</div>` : '') +
        (demo ? '<div style="font-size:12px;opacity:.8">テストモードのため保存されません</div>' : ''));
  render();
});

const fmtDist = m => m < 1000 ? `約${Math.round(m / 10) * 10}m` : `約${(m / 1000).toFixed(1)}km`;

function renderSpots() {
  // 地図の印（訪問済みかどうかが変わったものだけ描き直す）
  const changed = [];
  SPOTS.forEach(s => {
    const m = spotMarkers[s.id], visited = !!state.spots[s.id];
    if (m.visited !== visited) { m.setIcon(spotIcon(s, visited)); m.visited = visited; changed.push(m); }
  });
  // まとめた丸の色（全部訪問済みなら灰色）も描き直す
  if (changed.length && spotLayer.refreshClusters) spotLayer.refreshClusters(changed);

  // 近くの観光地
  const n = nearestSpot();
  const box = $('spotBox'), hint = $('spotHint');
  if (n && n.dist <= SPOT_RADIUS_M) {
    const v = state.spots[n.spot.id], block = spotBlock(n);
    box.hidden = false; hint.textContent = '';
    $('spotName').textContent = `${spotType(n.spot).icon} ${n.spot.name}`;
    $('spotStatus').innerHTML = v
      ? `<span class="status old">訪問済み ${v.count}回</span>`
      : '<span class="status new">未訪問！</span>';
    $('spotSub').textContent = `${spotType(n.spot).label}・ここから ${fmtDist(n.dist)}`;
    $('spotCheckin').disabled = !!block;
    $('spotCheckin').textContent = block || `観光地チェックイン +${v ? XP_SPOT_REVISIT : XP_SPOT_NEW} XP`;
  } else {
    box.hidden = true;
    hint.textContent = n && n.dist <= SPOT_HINT_M
      ? `🧭 近くの観光地：${spotType(n.spot).icon} ${n.spot.name}（${fmtDist(n.dist)}）` : '';
  }
}

// ===== 駅チェックイン =====
// 現在地からいちばん近い駅と距離（m）。ホームが離れている駅（p）は一番近いホームまでの距離
function nearestStation() {
  if (!current || !STATIONS) return null;
  const here = L.latLng(current.lat, current.lng);
  let best = null;
  STATIONS.forEach(st => {
    let d = here.distanceTo([st.lat, st.lng]);
    (st.p || []).forEach(pt => { d = Math.min(d, here.distanceTo(pt)); });
    if (!best || d < best.dist) best = { st, dist: d };
  });
  return best;
}

// 駅にチェックインできない理由（できるなら null）
function stationBlock(n) {
  if (!n || n.dist > STATION_RADIUS_M) return '範囲外';
  if (!demo && current.acc > MAX_ACC_M) return `GPS精度が低いです（${MAX_ACC_M}m以内で可能）`;
  const v = state.stations[n.st.id];
  if (v && v.last === today()) return '今日はチェックイン済み';
  return movingBlock();
}

$('stCheckin').addEventListener('click', () => {
  const n = nearestStation();
  if (stationBlock(n)) return;
  const st = n.st, v = state.stations[st.id];
  let gain, title;
  if (!v) {
    gain = XP_STATION_NEW; title = '🚉 駅に到着！';
    state.stations[st.id] = { name: st.name, pref: st.pref, city: st.city || '', first: today(), last: today(), count: 1 };
  } else {
    gain = XP_STATION_REVISIT; title = 'また来ました';
    v.last = today(); v.count++;
  }
  const before = levelOf(state.xp);
  state.xp += gain;
  save();
  const after = levelOf(state.xp);
  toast(`${title}<br>${esc(st.name)}駅<div class="big">+${gain} XP</div>` +
        (after > before ? `<div>⬆ レベルアップ！ Lv${after}</div>` : '') +
        (demo ? '<div style="font-size:12px;opacity:.8">テストモードのため保存されません</div>' : ''));
  render();
});

// 駅の近く（STATION_RADIUS_M 以内）にいるときだけ案内カードを出す
function renderStations() {
  const n = nearestStation(), box = $('stBox');
  if (!n || n.dist > STATION_RADIUS_M) { box.hidden = true; return; }
  const v = state.stations[n.st.id], block = stationBlock(n);
  box.hidden = false;
  $('stName').textContent = `🚉 ${n.st.name}駅`;
  $('stStatus').innerHTML = v
    ? `<span class="status old">訪問済み ${v.count}回</span>`
    : '<span class="status new">未訪問！</span>';
  $('stLines').innerHTML = lineChips(n.st);
  $('stSub').textContent = `ここから ${fmtDist(n.dist)}`;
  $('stCheckin').disabled = !!block;
  $('stCheckin').textContent = block || `駅チェックイン +${v ? XP_STATION_REVISIT : XP_STATION_NEW} XP`;
}

// ===== 訪問済み一覧（市町村／観光地は県ごと／駅は路線ごとの達成率） =====
function renderLists() {
  // 開いているグループは作り直したあとも開いたままにする
  const openKeys = new Set([...document.querySelectorAll('#list details.comp[open]')].map(d => d.dataset.key));
  const bar = (n, total, color) =>
    `<span class="c-bar"><div style="width:${total ? n / total * 100 : 0}%${color ? ';background:' + esc(color) : ''}"></div></span>`;
  const num = (n, total, unit) => {
    const done = total > 0 && n === total;
    return `<span class="c-num${done ? ' done' : ''}">${n} / ${total}${unit}${done ? ' 🎉' : ''}</span>`;
  };
  const group = (key, nameHtml, n, total, unit, color, itemsHtml) =>
    `<details class="comp" data-key="${esc(key)}"${openKeys.has(key) ? ' open' : ''}>` +
    `<summary><span class="c-name">${nameHtml}</span>${bar(n, total, color)}${num(n, total, unit)}</summary>${itemsHtml}</details>`;

  // 市町村（都道府県の順）
  const list = Object.values(state.visited);
  $('count').textContent = list.length;
  const byPref = {};
  list.forEach(v => (byPref[v.pref] = byPref[v.pref] || []).push(v));
  $('visited').innerHTML = `<div class="list-h">市町村（${list.length}）</div>` +
    Object.keys(byPref).sort((a, b) => prefRank(a) - prefRank(b)).map(p =>
      `<div class="pref-h">${esc(p)}（${byPref[p].length}）</div>` +
      byPref[p].sort((a, b) => a.first < b.first ? 1 : -1)
        .map(v => `<div class="muni">${esc(v.city)}<span>${esc(v.first)}〜 ${v.count}回</span></div>`).join('')
    ).join('') + (list.length ? '' : '<div class="muni">まだありません</div>');

  // 観光地：県ごとの達成率（タップで開くと、その県の観光地が並ぶ）
  const sIds = Object.keys(state.spots);
  $('spotCount').textContent = sIds.length;
  const groups = {};
  SPOTS.forEach(s => (groups[s.pref] = groups[s.pref] || []).push({ id: s.id, name: s.name, icon: spotType(s).icon }));
  sIds.filter(id => !spotById(id)).forEach(id => { // リストから消えた観光地も記録は見せる
    const v = state.spots[id], p = v.pref || 'その他';
    (groups[p] = groups[p] || []).push({ id, name: v.name, icon: '📍' });
  });
  $('spotList').innerHTML = `<div class="list-h">観光地（${sIds.length} / ${SPOTS.length}）</div>` +
    Object.keys(groups).sort((a, b) => prefRank(a) - prefRank(b)).map(p => {
      const items = groups[p].slice().sort((a, b) => (state.spots[b.id] ? 1 : 0) - (state.spots[a.id] ? 1 : 0)); // 訪問済みを上に
      const n = items.filter(i => state.spots[i.id]).length;
      return group('pref:' + p, esc(p), n, items.length, '', '', items.map(i => {
        const v = state.spots[i.id];
        return `<div class="muni spot-item${v ? '' : ' todo'}" data-id="${esc(i.id)}">${v ? '✅' : '・'} ${i.icon} ${esc(i.name)}${v && v.memo ? ' 📝' : ''}` +
          `<span>${v ? `${esc(v.first)}〜 ${v.count}回` : '未訪問'}</span></div>`;
      }).join(''));
    }).join('');

  // 駅：路線ごとの達成率
  const stIds = Object.keys(state.stations);
  $('stCount').textContent = stIds.length;
  if (!STATIONS) {
    $('stationList').innerHTML = `<div class="list-h">駅（${stIds.length}）</div><div class="list-note">駅データを読み込み中…</div>`;
    return;
  }
  const nVisited = STATIONS.filter(s => state.stations[s.id]).length;
  $('stationList').innerHTML = `<div class="list-h">駅（${nVisited} / ${STATIONS.length}）</div>` +
    `<div class="list-note">路線ごとの達成率（いまは${esc(STATION_AREA || '一部の地域')}内の駅だけ）。駅をタップすると地図でその駅を表示</div>` +
    LINES.map(l => {
      const n = l.st.filter(id => state.stations[id]).length;
      const name = `<span class="line-chip"><i style="background:${esc(l.color)}"></i></span>${esc(l.label)}`;
      return group('line:' + l.id, name, n, l.st.length, '駅', l.color, l.st.map(id => {
        const s = stationIndex[id], v = state.stations[id];
        if (!s) return '';
        return `<div class="muni st-item${v ? '' : ' todo'}" data-id="${esc(id)}">${v ? '✅' : '・'} ${esc(s.name)}` +
          `<span>${v ? `${esc(v.first)}〜 ${v.count}回` : '未訪問'}</span></div>`;
      }).join(''));
    }).join('');
}
// 駅一覧の駅をタップすると、地図をその駅に動かす
document.addEventListener('click', e => {
  const item = e.target.closest && e.target.closest('.st-item');
  if (!item) return;
  const s = stationIndex[item.dataset.id];
  if (s) { map.setView([s.lat, s.lng], Math.max(map.getZoom(), 15)); window.scrollTo(0, 0); }

// 一覧を開いたら駅データも読み込む
$('list').addEventListener('toggle', () => { if ($('list').open) loadStations(); });

// ===== 観光地の詳細カード =====
function openSpotDetail(id) {
  const s = spotById(id), v = state.spots[id];
  if (!s && !v) return;
  const t = spotType(s);
  $('dIcon').textContent = t.icon;
  $('dIcon').className = 'detail-icon t-' + ((s && s.type) || 'other');
  $('dName').textContent = s ? s.name : v.name;
  const pref = (s && s.pref) || (v && v.pref) || '', city = (s && s.city) || (v && v.city) || '';
  $('dType').textContent = [t.label, (pref + ' ' + city).trim()].filter(Boolean).join('・');
  $('dDesc').textContent = SPOT_DESC[id] || '説明はまだありません。';
  $('dStatus').textContent = v ? '✅ 訪問済み' : '未訪問';
  $('dFirst').textContent = v ? v.first : '未訪問';
  $('dLast').textContent = v ? v.last : '―';
  $('dCount').textContent = `${v ? v.count : 0}回`;
  $('dXp').textContent = `${spotXp(v)} XP`;
  // 思い出メモ（訪問済みの観光地だけ書ける）
  detailId = id;
  const memo = $('dMemo');
  memo.value = (v && v.memo) || '';
  memo.disabled = !v;
  memo.placeholder = v ? '誰と行った、何を食べた、どんな景色だった など' : 'チェックインするとメモを残せます';
  $('dMemoInfo').textContent = v ? `${memo.value.length} / 500` : '';
  if (s && current) {
    $('dDist').textContent = fmtDist(L.latLng(current.lat, current.lng).distanceTo([s.lat, s.lng]));
  } else {
    $('dDist').textContent = s ? '現在地が未取得' : '―';
  }
  // 行き方はGoogleマップ（アプリがあればアプリ）で開く
  if (s) {
    $('dRoute').href = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
    $('dRoute').hidden = false;
  } else {
    $('dRoute').hidden = true; // リストから消えた観光地は位置が分からない
  }
  $('detail').hidden = false;
}
// この観光地でこれまでに得たXP（初訪問 + 再訪の回数分）
const spotXp = v => v ? XP_SPOT_NEW + (v.count - 1) * XP_SPOT_REVISIT : 0;

// 思い出メモは入力するたびに少し待って自動保存する
let detailId = null, memoTimer = null;
function saveMemo() {
  clearTimeout(memoTimer);
  const v = detailId && state.spots[detailId];
  if (!v) return;
  const text = $('dMemo').value.trim();
  if (text === (v.memo || '')) return;
  if (text) v.memo = text; else delete v.memo;
  save();
  $('dMemoInfo').textContent = `${$('dMemo').value.length} / 500　` +
    (demo ? 'テストモードのため保存されません' : '✓ 保存しました');
  render();
}
$('dMemo').addEventListener('input', () => {
  $('dMemoInfo').textContent = `${$('dMemo').value.length} / 500`;
  clearTimeout(memoTimer);
  memoTimer = setTimeout(saveMemo, 600);
});
$('dMemo').addEventListener('blur', saveMemo);

function closeSpotDetail() { saveMemo(); $('detail').hidden = true; detailId = null; }
$('dClose').addEventListener('click', closeSpotDetail);
$('detail').addEventListener('click', e => { if (e.target === $('detail')) closeSpotDetail(); }); // 外側をタップで閉じる
$('spotList').addEventListener('click', e => { // 訪問済み一覧からも詳細を開ける
  const item = e.target.closest('.spot-item');
  if (item) openSpotDetail(item.dataset.id);
});

// ===== 画面更新 =====
function showPlace(name, pref, sub) {
  $('place').textContent = name; $('pref').textContent = pref; $('status').innerHTML = '';
  if (sub !== undefined) $('sub').textContent = sub;
}

function render() {
  // レベル
  const L = levelOf(state.xp), lo = needXp(L), hi = needXp(L + 1);
  $('lv').textContent = L;
  $('barfill').style.width = ((state.xp - lo) / (hi - lo) * 100) + '%';
  $('xptext').textContent = `${state.xp} XP（次のレベルまで ${hi - state.xp}）`;

  // 現在地
  const btn = $('checkin');
  if (current && current.muni) {
    const m = current.muni, v = state.visited[keyOf(m)];
    $('place').textContent = m.city;
    $('pref').textContent = [m.pref, m.ward, m.area].filter(Boolean).join(' ');
    $('status').innerHTML = v
      ? `<span class="status old">訪問済み ${v.count}回</span>`
      : '<span class="status new">未訪問！</span>';
    const block = checkinBlock();
    btn.disabled = !!block;
    btn.textContent = block || `チェックイン +${v ? XP_REVISIT : XP_NEW} XP`;
  } else if (current) {
    if (lookupPending) showPlace('市町村を調べています…', '');
    else showPlace('市町村が判定できません', '海上・通信エラーなど（自動で再試行します）');
    btn.disabled = true; btn.textContent = 'チェックイン';
  }

  renderSpots();
  renderStations();

  // 一覧は記録が変わったときだけ作り直す（GPSの更新のたびに作り直すと、開いた項目が閉じてしまうため）
  if (listDirty) { renderLists(); listDirty = false; }

  // 駅の点（訪問済みは白抜き）は、駅の記録が変わったときだけ描き直す
  const sig = demo + ':' + Object.keys(state.stations).join(',');
  if (sig !== stationSig) { stationSig = sig; refreshStationLayer(); }
}

// HTMLに埋め込む文字のエスケープ（読み込んだファイルやOSMの名前に記号が入っていても安全にする）
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ===== バックアップ（ファイルへ保存／ファイルから読み込み） =====
function renderBackupInfo() {
  let d = null;
  try { d = localStorage.getItem(BACKUP_KEY); } catch (e) {}
  $('backupInfo').textContent = d ? `最後にファイルへ保存した日：${d}` : 'まだ一度もファイルへ保存していません';
}

$('export').addEventListener('click', () => {
  const real = demo ? realState : state; // テストモード中でも本物の記録を保存する
  const data = { app: 'tabilog', version: 1, exported: today(), xp: real.xp, visited: real.visited, spots: real.spots, stations: real.stations };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tabilog-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  try { localStorage.setItem(BACKUP_KEY, today()); } catch (e) {}
  renderBackupInfo();
  toast('💾 保存しました<div style="font-size:12px;margin-top:4px">「ダウンロード」フォルダに<br>' + esc(a.download) + '</div>');
});

$('import').addEventListener('click', () => {
  if (demo) { alert('テストモード中は読み込めません。テストを終了してから操作してください。'); return; }
  $('importFile').value = '';
  $('importFile').click();
});

$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  let data;
  try { data = parseBackup(await f.text()); }
  catch (err) { alert('読み込めませんでした：' + err.message); return; }
  const desc = s => `${s.xp} XP・${Object.keys(s.visited).length}市町村・観光地${Object.keys(s.spots).length}か所・${Object.keys(s.stations).length}駅`;
  if (!confirm(`ファイルの記録（${desc(data)}）で、今の記録（${desc(state)}）を置き換えます。よろしいですか？`)) return;
  state = data; save(); render();
  toast('📂 記録を読み込みました');
});

// バックアップファイルの中身を確かめて、記録の形に整える（おかしければ例外）
function parseBackup(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('たびログの記録ファイルではありません'); }
  if (!j || typeof j.xp !== 'number' || !(j.xp >= 0) || typeof j.visited !== 'object' || j.visited === null) {
    throw new Error('たびログの記録ファイルではありません');
  }
  const visited = {};
  for (const v of Object.values(j.visited)) {
    const ok = v && ['pref', 'city', 'first', 'last'].every(f => typeof v[f] === 'string') && typeof v.count === 'number';
    if (!ok) throw new Error('記録の形式が正しくありません');
    visited[v.pref + '/' + v.city] = { pref: v.pref, city: v.city, first: v.first, last: v.last, count: v.count };
  }
  // 観光地の記録（観光地機能より前に保存したファイルには無い）
  const spots = {};
  if (j.spots !== undefined) {
    if (typeof j.spots !== 'object' || j.spots === null) throw new Error('記録の形式が正しくありません');
    for (const [id, v] of Object.entries(j.spots)) {
      const ok = v && ['name', 'first', 'last'].every(f => typeof v[f] === 'string') && typeof v.count === 'number';
      if (!ok) throw new Error('観光地の記録の形式が正しくありません');
      spots[id] = { name: v.name, pref: typeof v.pref === 'string' ? v.pref : '', first: v.first, last: v.last, count: v.count };
      if (typeof v.city === 'string') spots[id].city = v.city;
      if (typeof v.memo === 'string' && v.memo) spots[id].memo = v.memo.slice(0, 500);
    }
  }
  // 駅の記録（駅機能より前に保存したファイルには無い）
  const stations = {};
  if (j.stations !== undefined) {
    if (typeof j.stations !== 'object' || j.stations === null) throw new Error('記録の形式が正しくありません');
    for (const [id, v] of Object.entries(j.stations)) {
      const ok = v && ['name', 'first', 'last'].every(f => typeof v[f] === 'string') && typeof v.count === 'number';
      if (!ok) throw new Error('駅の記録の形式が正しくありません');
      stations[id] = { name: v.name, pref: typeof v.pref === 'string' ? v.pref : '', city: typeof v.city === 'string' ? v.city : '',
        first: v.first, last: v.last, count: v.count };
    }
  }
  return { xp: Math.floor(j.xp), visited, spots, stations };
}

let toastTimer;
function toast(html) {
  const t = $('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== ボタン類 =====
$('locate').addEventListener('click', () => {
  if (demo) toggleDemo();
  firstFix = true; lastLookup = null; startWatch();
});
function toggleDemo() {
  demo = !demo;
  // テスト中は記録のコピーで遊び、終わったら本物の記録に戻す
  if (demo) { realState = state; state = JSON.parse(JSON.stringify(state)); }
  else { state = realState; realState = null; }
  fixes = []; // テストの前後で速度の計算が混ざらないように
  listDirty = true;
  render();
  document.body.classList.toggle('demo', demo);
  $('demo').classList.toggle('on', demo);
  $('demo').textContent = demo ? '🧪 テスト終了' : '🧪 テストモード';
  if (demo) { stopWatch(); $('sub').textContent = '地図をタップしてください'; }
  else startWatch();
  setTimeout(() => map.invalidateSize(), 50);
}
$('demo').addEventListener('click', toggleDemo);
map.on('click', e => { if (demo) setPosition(e.latlng.lat, e.latlng.lng, 0, true); });
$('reset').addEventListener('click', () => {
  if (confirm('経験値と訪問記録をすべて消します。よろしいですか？')) {
    state = { xp: 0, visited: {}, spots: {}, stations: {} }; save(); render();
  }
});

render();
renderBackupInfo();
startWatch();
</script>
