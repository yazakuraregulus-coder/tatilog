<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e6f5c">
<meta name="mobile-web-app-capable" content="yes">
<title>たびログ（試作）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root { --main:#1e6f5c; --accent:#f0a500; --bg:#f4f6f5; --text:#222; --muted:#6b7570; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { background:var(--main); color:#fff; padding:10px 14px calc(10px) ; padding-top:calc(10px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:10px; }
  header .hmain { flex:1; min-width:0; }
  .hrow { display:flex; justify-content:space-between; align-items:baseline; }
  .title { font-weight:700; font-size:17px; }
  .lv { font-size:15px; } .lv b { font-size:22px; }
  .bar { height:8px; background:rgba(255,255,255,.25); border-radius:4px; margin-top:6px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .6s; }
  .xptext { font-size:11px; opacity:.85; margin-top:3px; text-align:right; }
  #map { flex:1; min-height:240px; }
  .panel { background:#fff; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -2px 8px rgba(0,0,0,.08); z-index:500; }
  /* 市町村名・状態・都道府県・GPS精度を1行に（入りきらないときは折り返す） */
  .place-line { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; row-gap:2px; margin-bottom:8px; }
  #place { font-size:20px; font-weight:700; }
  #status .status { margin-left:0; }
  #pref, #sub { font-size:12px; color:var(--muted); }
  #sub:empty, #pref:empty { display:none; }
  #pref + #sub::before { content:'・'; }
  #pref:empty + #sub::before { content:''; }
  .status { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .new { background:#ffe9b3; color:#8a5a00; } .old { background:#e3efe9; color:var(--main); }
  .status.done { background:#7cb342; color:#fff; }
  /* 今日チェックイン済みの観光地・道の駅・駅（カードの代わりの1行） */
  .done-line { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .done-line[hidden] { display:none; }
  .done-chip { font-size:12px; padding:4px 9px; border-radius:14px; background:#f3fae9; border:1px solid #b9d98f; color:#33691e;
    white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .done-chip.tap { cursor:pointer; }
  /* 地図の上の「現在地を更新」ボタン */
  .locate-btn { width:44px; height:44px; border-radius:50%; background:#fff; border:2px solid rgba(0,0,0,.2);
    box-shadow:0 1px 4px rgba(0,0,0,.25); font-size:20px; padding:0; display:flex; align-items:center; justify-content:center; }
  /* 出典（ふだんは短く1行。ⓘ で全文） */
  .leaflet-control-attribution { display:none; }
  .attr-open .leaflet-control-attribution { display:block; font-size:10px; }
  .attr-short { background:rgba(255,255,255,.8); font-size:10px; color:#333; padding:1px 6px; cursor:pointer; white-space:nowrap; }
  .attr-short b { color:#1F5FB0; font-weight:400; margin-left:3px; }
  .demo-banner button { margin-left:8px; background:#fff; color:#d33; font-size:12px; font-weight:700; padding:2px 10px; border-radius:10px; }
  .drawer-panel button.demo-item.on { color:#d33; font-weight:700; }
  button { font:inherit; border:none; border-radius:10px; padding:12px; cursor:pointer; }
  #checkin { width:100%; background:var(--accent); color:#fff; font-size:18px; font-weight:700; }
  #checkin:disabled { background:#c9cfcc; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row button { flex:1; background:#e3efe9; color:var(--main); font-size:14px; }
  .row button.on { background:#d33; color:#fff; }
  details { background:#fff; border-top:1px solid #e5e5e5; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); max-height:40vh; overflow:auto; }
  summary { font-weight:700; cursor:pointer; }
  .pref-h { margin:10px 0 4px; font-size:13px; color:var(--main); font-weight:700; }
  .muni { font-size:14px; padding:3px 0; display:flex; justify-content:space-between; border-bottom:1px dotted #ddd; }
  .muni span { color:var(--muted); font-size:12px; }
  .spot { margin-top:10px; padding:10px; border:2px solid #7b4fc9; border-radius:12px; background:#f5f0fd; }
  .spot[hidden] { display:none; }
  .spot-name { font-size:17px; font-weight:700; color:#5a32a3; }
  .spot-sub { font-size:12px; color:var(--muted); margin:2px 0 8px; }
  .spot .status.new { background:#e6dbfa; color:#5a32a3; }
  #spotCheckin { width:100%; background:#7b4fc9; color:#fff; font-size:16px; font-weight:700; }
  #spotCheckin:disabled { background:#c9cfcc; }
  .spot-hint { font-size:12px; color:#5a32a3; margin-top:8px; min-height:1em; }
  .spot-marker { background:#fff; border:2px solid #7b4fc9; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; }
  .spot-marker.t-temple span { color:#b3261e; font-weight:700; font-size:17px; }
  /* 訪問済み：アイコンは元の色のまま、ふちを黄緑に */
  .spot-marker.visited { border:3px solid #7cb342; background:#f3fae9; }
  .spot-marker.today { opacity:.5; }  /* 今日訪問した観光地は半透明（日付が変わると元に戻る） */
  /* 駅の層（SVG）は余白のタップを下の観光地アイコンへ通す。駅の丸（path.leaflet-interactive）だけがタップを受ける */
  .leaflet-stations-pane > svg { pointer-events:none; }
  .spot-cluster { background:#7b4fc9; color:#fff; border:3px solid rgba(255,255,255,.9); border-radius:50%;
    box-shadow:0 1px 5px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; }
  .spot-cluster.visited { background:#7cb342; }
  /* レア枠（金の枠） */
  .spot-marker.rare { border:3px solid #d4a017; background:#fff8dc; box-shadow:0 0 0 2px rgba(212,160,23,.35), 0 1px 5px rgba(0,0,0,.4); }
  .spot-marker.rare.visited { border:3px solid #d4a017; background:#fff8dc; box-shadow:0 0 0 3px #7cb342, 0 1px 5px rgba(0,0,0,.4); }
  .spot-cluster.rare { border-color:#d4a017; box-shadow:0 0 0 3px rgba(212,160,23,.6), 0 1px 5px rgba(0,0,0,.4); }
  .spot.rare { border-color:#d4a017; background:#fffbea; }
  .spot.rare .spot-name { color:#9a6b00; }
  .detail-icon.rare { border:3px solid #d4a017; background:#fff8dc; box-shadow:0 0 0 2px rgba(212,160,23,.35), 0 1px 5px rgba(0,0,0,.4); }
  /* 詳細カードのアイコンも、チェックイン済みなら地図の印と同じ黄緑のふち（レアは金の枠の外側に黄緑の輪） */
  .detail-icon.visited { border:3px solid #7cb342; background:#f3fae9; }
  .detail-icon.rare.visited { border:3px solid #d4a017; background:#fff8dc; box-shadow:0 0 0 3px #7cb342, 0 1px 5px rgba(0,0,0,.4); }
  /* 観光地のフキダシ（タップで詳細） */
  .spot-pop { cursor:pointer; text-align:center; }
  .spot-pop b { display:block; font-size:14px; }
  .spot-pop span { font-size:11px; color:#7b4fc9; }
  .leaflet-popup-content { margin:8px 12px; }
  /* 観光地の詳細カード */
  .detail { position:fixed; inset:0; z-index:1500; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; }
  .detail[hidden] { display:none; }
  .detail-card { background:#fff; width:100%; max-width:520px; border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto; }
  .detail-head { display:flex; gap:12px; align-items:center; }
  .detail-icon { width:48px; height:48px; flex:none; border:2px solid #7b4fc9; border-radius:50%; background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1; }
  .detail-icon.t-temple { color:#b3261e; font-weight:700; }
  .detail-name { font-size:19px; font-weight:700; }
  .detail-type { font-size:12px; color:var(--muted); }
  /* 世界遺産の表記（詳細カード） */
  .detail-wh { margin-top:10px; padding:6px 10px; border-radius:8px; font-size:13px; font-weight:700; line-height:1.5;
    background:#e8f1fb; color:#1f4e8c; border:1px solid #b9d2ef; }
  .detail-wh.nature { background:#e9f6ec; color:#1e6b34; border-color:#b7dfc1; }
  .detail-wh[hidden] { display:none; }
  .detail-desc { font-size:14px; line-height:1.7; margin:12px 0; }
  .detail-rows { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:14px;
    background:var(--bg); border-radius:10px; padding:10px 12px; }
  .detail-rows dt { color:var(--muted); }
  .detail-rows dd { margin:0; font-weight:700; }
  .detail-route { flex:1; display:flex; align-items:center; justify-content:center; border-radius:10px; padding:12px;
    background:#7b4fc9; color:#fff; text-decoration:none; font-size:14px; font-weight:700; }
  .detail-route[hidden] { display:none; }
  .memo { margin-top:12px; }
  .memo label { font-size:13px; font-weight:700; }
  .memo textarea { width:100%; margin-top:4px; font:inherit; font-size:14px; padding:8px 10px;
    border:1px solid #cfd6d3; border-radius:10px; resize:vertical; }
  .memo textarea:disabled { background:var(--bg); }
  .memo-info { font-size:11px; color:var(--muted); min-height:1.2em; margin-top:2px; text-align:right; }
  .spot-item { cursor:pointer; }
  /* ☰メニュー */
  .title { display:flex; align-items:center; gap:8px; }
  .menu-btn { background:rgba(255,255,255,.18); color:#fff; font-size:18px; line-height:1; padding:6px 9px; border-radius:8px; }
  .drawer { position:fixed; inset:0; z-index:1300; background:rgba(0,0,0,.4); }
  .drawer[hidden] { display:none; }
  .drawer-panel { position:absolute; left:0; top:0; bottom:0; width:min(78vw, 300px); background:#fff;
    padding-top:env(safe-area-inset-top); display:flex; flex-direction:column; box-shadow:2px 0 12px rgba(0,0,0,.25); }
  .drawer-head { background:var(--main); color:#fff; font-weight:700; font-size:17px; padding:16px; }
  .drawer-panel button { text-align:left; background:none; border-radius:0; border-bottom:1px solid #eee; padding:16px; font-size:16px; }
  .drawer-panel button:active { background:var(--bg); }
  /* 全画面ページ */
  .page { position:fixed; inset:0; z-index:1200; background:var(--bg); display:flex; flex-direction:column; }
  .page[hidden] { display:none; }
  .page-head { display:flex; align-items:center; gap:6px; background:var(--main); color:#fff;
    padding:8px 8px; padding-top:calc(8px + env(safe-area-inset-top)); }
  .page-back { background:none; color:#fff; font-size:20px; padding:6px 10px; }
  .page-title { flex:1; font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .page-body { flex:1; overflow:auto; padding:10px 12px calc(16px + env(safe-area-inset-bottom)); }
  .page-body[hidden] { display:none; }
  .manage .row button { padding:14px; }
  .nav-row { width:100%; display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:14px 12px;
    margin-bottom:8px; text-align:left; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .nav-row .n-main { flex:1; min-width:0; }
  .nav-row .n-title { font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .nav-row .n-sub { font-size:12px; color:var(--muted); margin-top:3px; }
  .nav-row .n-arrow { color:var(--muted); font-size:18px; }
  .nav-row .c-bar { width:100%; margin-top:6px; }
  /* 達成状況の行（左：名前と達成率％、右：アイコン＋太字の数字＋小さなバー） */
  .stat-row { align-items:center; }
  .stat-row .s-left { flex:1; min-width:0; }
  .stat-row .s-name { font-size:16px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .stat-row .s-pct { font-size:24px; font-weight:800; color:var(--main); line-height:1.1; margin-top:2px; font-variant-numeric:tabular-nums; }
  .stat-row .s-pct small { font-size:13px; font-weight:700; margin-left:1px; }
  .stat-row .s-right { display:grid; grid-template-columns:auto auto 46px; gap:4px 6px; align-items:center; flex:none; }
  .stat-row .s-ic { font-size:14px; text-align:center; }
  .stat-row .s-num { font-size:16px; font-weight:800; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; color:#333; }
  .stat-row .s-num.on { color:var(--main); }
  .stat-row .s-num.done { color:#c99a00; }
  .stat-row .s-num.none { color:#b5bdb9; font-weight:700; }
  .stat-row .s-num .t { font-size:12px; font-weight:700; color:var(--muted); }
  .stat-row .s-bar { height:6px; background:#e5e9e7; border-radius:3px; overflow:hidden; }
  .stat-row .s-bar > div { height:100%; background:var(--main); }
  .stat-row .s-bar > div.done { background:#d4a017; }
  .stat-row.zero { opacity:.5; }                          /* まだ1つも行っていない */
  .stat-row.zero .s-pct { color:var(--muted); }
  .stat-row.all-done { box-shadow:0 0 0 2px #d4a017 inset, 0 1px 3px rgba(0,0,0,.06); }  /* 全部達成 */
  .stat-row.all-done .s-pct { color:#c99a00; }
  .item { display:flex; align-items:center; gap:8px; background:#fff; padding:10px 12px; border-bottom:1px solid #eef1ef; font-size:14px; }
  .item:first-of-type { border-radius:10px 10px 0 0; }
  .item:last-child { border-radius:0 0 10px 10px; border-bottom:none; }
  .item.tap { cursor:pointer; }
  .item.todo .i-name { color:var(--muted); }
  .item .i-mark { width:20px; text-align:center; flex:none; }
  .item .i-main { flex:1; min-width:0; }
  .item .i-name { font-weight:700; }
  .item .i-sub { font-size:11px; color:var(--muted); margin-top:1px; }
  .item .i-right { font-size:11px; color:var(--muted); text-align:right; white-space:nowrap; }
  .items { border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:12px; }
  .sec-h { font-size:13px; font-weight:700; color:var(--main); margin:14px 2px 6px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:4px; }
  .chip { flex:none; background:#fff; border:1px solid #cfd6d3; border-radius:16px; padding:6px 12px; font-size:13px; }
  .chip.on { background:var(--main); color:#fff; border-color:var(--main); }
  /* メダル（丸の中に RATE。銅・銀・金・プラチナ） */
  .medal { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%;
    font-size:11px; font-weight:800; line-height:1; vertical-align:middle; font-variant-numeric:tabular-nums; flex:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.5), 0 1px 2px rgba(0,0,0,.3); }
  .medal.big { width:44px; height:44px; font-size:18px; box-shadow:inset 0 0 0 3px rgba(255,255,255,.55), 0 1px 4px rgba(0,0,0,.35); }
  .m-bronze { background:linear-gradient(135deg,#e0a06c,#a0602f); color:#fff; }
  .m-silver { background:linear-gradient(135deg,#f1f3f5,#a3abb4); color:#3a4048; }
  .m-gold { background:linear-gradient(135deg,#ffe57a,#d4a017); color:#5a3d00; }
  .m-platinum { background:linear-gradient(135deg,#ffffff,#cfe6f5 45%,#93b9d8); color:#1f3f5b;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.9), 0 0 6px rgba(110,180,255,.9); }
  .medal.big.m-platinum { box-shadow:inset 0 0 0 3px rgba(255,255,255,.9), 0 0 10px rgba(110,180,255,.95); }
  .i-name .medal { margin-left:2px; }
  .i-mark .medal { margin-left:-2px; }
  .item:has(.i-mark .medal) .i-mark { width:24px; }
  /* チェックインのお知らせのメダル */
  .toast-medal { display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0 4px; font-size:14px; text-align:left; }
  /* 詳細カードのメダル欄 */
  .detail-medal { margin-top:10px; background:#fbf7ec; border:1px solid #eadfbf; border-radius:10px; padding:10px 12px; font-size:13px; }
  .detail-medal[hidden] { display:none; }
  .dm-head { font-weight:700; margin-bottom:6px; }
  .dm-best { display:flex; align-items:center; gap:10px; }
  .dm-best-name { font-size:15px; font-weight:800; }
  .dm-best-rate { font-size:13px; color:var(--muted); font-weight:700; }
  .dm-count { margin-top:8px; font-size:12px; color:var(--muted); }
  .dm-list { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .dm-none { color:var(--muted); }
  .dm-next { margin-top:8px; font-size:11px; color:#8a6d1f; }
  /* 獲得メダルのページ */
  .medal-sum { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:6px; }
  .ms-cell { background:#fff; border-radius:12px; padding:10px 4px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06);
    display:flex; flex-direction:column; align-items:center; gap:2px; }
  .ms-cell.zero { opacity:.5; }
  .ms-label { font-size:13px; font-weight:800; margin-top:4px; }
  .ms-range { font-size:10px; color:var(--muted); }
  .ms-num { font-size:22px; font-weight:800; color:var(--main); font-variant-numeric:tabular-nums; }
  .ms-num small { font-size:11px; margin-left:1px; }
  .medal-help { margin-top:14px; line-height:1.7; }
  /* 検索ページ */
  .search-box { position:sticky; top:-10px; z-index:1; background:var(--bg); padding:2px 0 8px; }
  .search-box input { width:100%; font:inherit; font-size:16px; padding:11px 14px; border:2px solid #cfd6d3; border-radius:12px; background:#fff; }
  .search-box input:focus { outline:none; border-color:var(--main); }
  #searchResults .line-chip { margin-top:3px; }
  .empty { text-align:center; color:var(--muted); font-size:13px; padding:30px 10px; line-height:1.8; }
  .page .c-bar { height:7px; }
  /* お気に入り */
  .detail-title { flex:1; min-width:0; }
  .fav-btn { flex:none; background:none; border:2px solid #e0c060; color:#c99a00; border-radius:12px; padding:4px 8px;
    font-size:22px; line-height:1; display:flex; flex-direction:column; align-items:center; }
  .fav-btn small { font-size:9px; margin-top:2px; }
  .fav-btn.on { background:#fff6d6; }
  .spot-marker.fav::after { content:'★'; position:absolute; right:-6px; top:-7px; font-size:13px; color:#f0b400;
    text-shadow:0 0 2px #fff, 0 0 2px #fff; filter:none; }
  /* 注意：.spot-marker に position を指定しないこと。Leaflet のアイコンは position:absolute で置かれていて、
     relative などで上書きすると、表示中のアイコンの数に応じて位置がずれる（★の ::after は absolute のままで正しく付く） */
  /* 駅の案内カード */
  .spot.st { border-color:#1F5FB0; background:#eef4fc; }
  .spot.st .spot-name { color:#1F5FB0; }
  .spot.st .status.new { background:#d6e4f7; color:#1F5FB0; }
  #stCheckin { width:100%; background:#1F5FB0; color:#fff; font-size:16px; font-weight:700; }
  /* 道の駅の案内カード（道路標識の緑） */
  .spot.mc { border-color:#3B6D11; background:#eff6e7; }
  .spot.mc .spot-name { color:#2f5a0d; }
  .spot.mc .status.new { background:#dcebc7; color:#2f5a0d; }
  #mcCheckin { width:100%; background:#3B6D11; color:#fff; font-size:16px; font-weight:700; }
  #mcCheckin:disabled { background:#c9cfcc; }
  /* 道の駅の地図の印（角丸の四角。観光地の丸と形で見分ける。※ position は指定しない） */
  /* 大きさは 24px（2026-11-27 に 30px から小さくした。観光地の丸は 30px のまま） */
  .michi-marker { background:#fff; border:2px solid #7b4fc9; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.35);

<script>
// ===== 設定 =====

const LOOKUP_MOVE_M = 150; // この距離以上動いたら市町村を調べ直す
const MAX_ACC_M = 200;     // GPS精度がこれより悪いときはチェックインできない
const RETRY_MS = 10000;    // 市町村の判定に失敗したときの再試行間隔（失敗が続くと倍々に延ばす）
const RETRY_MAX_MS = 120000; // 再試行間隔の上限
const STORE_KEY = 'tabilog-v1';
const BACKUP_KEY = 'tabilog-last-backup'; // 最後にファイルへ保存した日
const XP_SPOT_NEW = 50;      // 初めての観光地
const XP_SPOT_REVISIT = 20;  // 観光地の再訪（1日1回。2026-11-25 に 5 → 20）

const MAX_SPEED_KMH = 10;       // 観光地・駅は、これより速く動いているとチェックインできない（電車での通過を防ぐ）
const SPEED_WINDOW_MS = 5000;   // GPSが速度を返さないときは、この時間以上前の位置との差から速度を計算する
const STILL_AFTER_MS = 6000;    // 位置の更新がこの時間なければ「止まっている」とみなす
// 都道府県の並び順（一覧の表示用）
const PREF_ORDER = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県',
  '新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県',
  '鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
const prefRank = p => { const i = PREF_ORDER.indexOf(p); return i < 0 ? 99 : i; };

// ===== 観光地リスト =====
// 観光地リストは spots.json から読み込む（起動時に読み込む。追加・修正は spots.json だけでよい）
// 各観光地：{ id, type, name, pref, city, lat, lng, desc }。id は英数字とハイフンで、一度決めたら変えない（記録のキーになる）
// 複数の県にまたがる観光地（三県境など）は prefs に全部の県、レア枠は rare: true
const SPOTS_URL = 'spots.json';
let SPOTS = [];
const SPOT_DESC = {};   // id → 説明
const spotIndex = {};   // id → 観光地
const spotById = id => spotIndex[id];
const spotPrefs = s => (s && (s.prefs || [s.pref])) || [];
const XP_RARE_NEW = 150; // レア枠の観光地の初訪問（再訪は通常と同じ XP_SPOT_REVISIT）

// ===== メダル（観光地のチェックインごとに1枚。RATE 1〜99 で、数字が小さいほどレア。レアスポットも同じ） =====
// 記録は state.spots[id].medals = [{ r: RATE, d: 'YYYY-MM-DD' }, …]（入手したメダルを全部残す。表示はベスト＝一番小さい RATE）
const MEDAL_TIERS = [
  { key: 'platinum', label: 'プラチナ', max: 9 },
  { key: 'gold', label: '金', max: 29 },
  { key: 'silver', label: '銀', max: 59 },
  { key: 'bronze', label: '銅', max: 99 },
];
const medalTier = r => MEDAL_TIERS.find(t => r <= t.max) || MEDAL_TIERS[3];
// n 回目の訪問で抽選する RATE の上限（1〜上限のどれも同じ確率）：1回目 99、2回目 79、3回目以降 49
const medalRange = n => n <= 1 ? 99 : n === 2 ? 79 : 49;
const drawMedal = n => 1 + Math.floor(Math.random() * medalRange(n));
const medalsOf = v => (v && Array.isArray(v.medals)) ? v.medals : [];
const bestMedal = v => { const m = medalsOf(v); return m.length ? Math.min(...m.map(x => x.r)) : null; };
const medalName = r => `${medalTier(r).label}メダル`;
// メダルの丸（中に RATE）。size：'' 小さい（一覧）、'big'（詳細・お知らせ）
const medalBadge = (r, size) => { const t = medalTier(r);
  return `<span class="medal m-${t.key}${size ? ' ' + size : ''}" title="${t.label}メダル RATE ${r}">${r}</span>`; };

// ===== 道の駅（spots.json の michi に入っている。観光地を兼ねる道の駅は spot に観光地の id を持つ） =====
// 観光地を兼ねる道の駅は、観光地としてチェックインする（XPも観光地のまま）。コンプリート一覧では観光地と道の駅の両方に数える
const XP_MICHI_NEW = 30;        // 初めての道の駅（暫定）
const XP_MICHI_REVISIT = 10;    // 道の駅の再訪（1日1回。2026-11-25 に 3 → 10）
const MICHI_RADIUS_M = 150;     // 道の駅からこの距離以内ならチェックインできる
const SHOW_MICHI_KEY = 'tabilog-show-michi'; // 道の駅の表示ON/OFF（この端末だけの設定）
let MICHI = [];                 // [{ id, name, pref, city, lat, lng, spot?, desc? }]
const michiIndex = {};
const michiById = id => michiIndex[id];
const isMichiId = id => typeof id === 'string' && id.startsWith('michi-');
const MICHI_TYPE = { icon: '🚗', label: '道の駅' };
// 道の駅の記録（観光地を兼ねる道の駅は、観光地の記録を見る）
const michiRec = m => m.spot ? state.spots[m.spot] : state.michi[m.id];

// 観光地の種類と地図のアイコン（観光地を追加するときは type をこの中から選ぶ）
const SPOT_TYPES = {
  shrine:   { icon: '⛩️', label: '神社' },
  temple:   { icon: '卍', label: '寺' },
  castle:   { icon: '🏯', label: '城' },
  onsen:    { icon: '♨️', label: '温泉' },
  nature:   { icon: '🌲', label: '自然' },
  lake:     { icon: '🛶', label: '湖・池・沼' },
  falls:    { icon: '🏞️', label: '滝・渓谷' },
  mountain: { icon: '⛰️', label: '山・高原' },
  sea:      { icon: '🌊', label: '海・海岸' },
  flower:   { icon: '🌸', label: '花・庭園' },
  history:  { icon: '🏛️', label: '歴史・文化' },
  art:      { icon: '🎨', label: '美術館' },
  tower:    { icon: '🗼', label: 'タワー' },
  landmark: { icon: '🏢', label: '名所' },
  town:     { icon: '🏮', label: '街並み' },
  animal:   { icon: '🐾', label: '動物' },
  leisure:  { icon: '🎡', label: 'レジャー' },
  themepark:{ icon: '🎢', label: 'テーマパーク' },
  shopping: { icon: '🛍️', label: '買い物・市場' },
};
const SPOT_TYPE_OTHER = { icon: '📍', label: '観光地' };
const spotType = s => (s && SPOT_TYPES[s.type]) || SPOT_TYPE_OTHER;

// ===== 保存データ =====
let state = load();
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  s = s || { xp: 0, visited: {} };
  s.spots = s.spots || {}; // 観光地の記録（古いデータには無いので補う）
  s.stations = s.stations || {}; // 駅の記録（同上）
  s.michi = s.michi || {};       // 道の駅の記録（観光地を兼ねる道の駅は spots 側に記録する）
  s.favs = s.favs || {};         // お気に入りの観光地・道の駅 { id: 登録した日 }
  if (!Array.isArray(s.log)) s.log = legacyLog(s); // チェックインの履歴（無ければ今までの記録から作る）
  return s;
}
// 履歴が無かったころの記録から、最後に訪問した日だけの履歴を作る（時刻は分からない）
function legacyLog(s) {
  const log = [];
  Object.values(s.visited || {}).forEach(v => log.push({ type: 'muni', id: v.pref + '/' + v.city, name: v.city, pref: v.pref, at: v.last }));
  Object.entries(s.spots || {}).forEach(([id, v]) => log.push({ type: 'spot', id, name: v.name, pref: v.pref || '', at: v.last }));
  Object.entries(s.stations || {}).forEach(([id, v]) => log.push({ type: 'station', id, name: v.name, pref: v.pref || '', at: v.last }));
  Object.entries(s.michi || {}).forEach(([id, v]) => log.push({ type: 'michi', id, name: v.name, pref: v.pref || '', at: v.last }));
  return log.sort((a, b) => a.at < b.at ? -1 : 1);
}
const LOG_MAX = 500; // 履歴は新しい500件まで残す
// チェックインを履歴に足す（日時は端末の時刻「YYYY-MM-DD HH:MM:SS」）
function addLog(type, id, name, pref, xp, medal) {
  const e = { type, id, name, pref: pref || '', at: new Date().toLocaleString('sv-SE'), xp };
  if (medal) e.medal = medal; // 観光地で入手したメダルの RATE
  state.log.push(e);
  if (state.log.length > LOG_MAX) state.log.splice(0, state.log.length - LOG_MAX);
}
// テストモード中は保存しない。記録が変わったので一覧は作り直す
let listDirty = true;
function save() { listDirty = true; if (demo) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

// ===== レベル計算（Lv2=100, Lv3=300, Lv4=600 …） =====
const needXp = L => 50 * (L - 1) * L;
function levelOf(xp) { let L = 1; while (xp >= needXp(L + 1)) L++; return L; }

// ===== 地図 =====
const map = L.map('map', { zoomControl: false }).setView([35.681, 139.767], 13);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'
}).addTo(map);
// 出典：スマホで3段にならないよう、ふだんは短い1行だけ出し、タップで Leaflet の出典（全文）を開く
const AttrShort = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const d = L.DomUtil.create('div', 'attr-short');
    d.innerHTML = '© 地理院タイル・国土数値情報・OSM<b>ⓘ</b>';
    d.title = '出典を表示';
    L.DomEvent.disableClickPropagation(d);
    d.addEventListener('click', () => {
      const open = map.getContainer().classList.toggle('attr-open');
      d.querySelector('b').textContent = open ? '✕' : 'ⓘ';
    });
    return d;
  },
});
new AttrShort().addTo(map);
// 現在地を更新するボタン（地図の右下）
const LocateBtn = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const b = L.DomUtil.create('button', 'locate-btn');
    b.id = 'locate'; b.type = 'button'; b.title = '現在地を更新'; b.setAttribute('aria-label', '現在地を更新'); b.textContent = '📍';
    L.DomEvent.disableClickPropagation(b);
    return b;
  },
});
new LocateBtn().addTo(map);
// 重なり順：観光地のアイコン（markerPane 600）＜ 駅の点（stations 640）＜ 現在地の点（me 650）＜ フキダシ（700）
map.createPane('stations').style.zIndex = 640;
map.createPane('me').style.zIndex = 650;
const marker = L.circleMarker([0, 0], { pane: 'me', radius: 8, color: '#fff', weight: 3, fillColor: '#1e6f5c', fillOpacity: 1 });
const accCircle = L.circle([0, 0], { radius: 0, color: '#1e6f5c', weight: 1, fillOpacity: 0.1 });

// 観光地の印（種類ごとのアイコン。未訪問は紫のふち、訪問済みは黄緑のふち、今日訪問したものは半透明、レア枠は金の枠）
function spotIcon(s, visited, fav, todayVisited) {
  return L.divIcon({
    className: `spot-marker t-${s.type || 'other'}${s.rare ? ' rare' : ''}${visited ? ' visited' : ''}${todayVisited ? ' today' : ''}${fav ? ' fav' : ''}`,
    html: `<span>${spotType(s).icon}</span>`,
    iconSize: [30, 30], iconAnchor: [15, 15], tooltipAnchor: [0, -15],
  });
}
// 近くにある観光地は数字付きの丸にまとめる（Leaflet.markercluster）。
// 読み込みに失敗したときは、まとめずにそのまま地図に置く
const spotLayer = L.markerClusterGroup
  ? L.markerClusterGroup({
      maxClusterRadius: 18,          // この画面上の距離（px）以内の印をまとめる（小さいほどまとめにくい。多少の重なりは許す）
      disableClusteringAtZoom: 11,   // ここまで拡大したら全部ばらして表示する
      showCoverageOnHover: false,
      animate: false,                // まとめる／ばらす時のアニメーションなし（途中の位置がズレて見えるのを防ぎ、スマホでも軽く）
      spiderfyOnMaxZoom: false,
      iconCreateFunction: cluster => {
        const ms = cluster.getAllChildMarkers();
        const allVisited = ms.every(m => m.visited);
        const rareLeft = ms.some(m => m.rare && !m.visited); // 未訪問のレア枠が入っていたら金の縁
        const size = ms.length < 10 ? 34 : ms.length < 100 ? 40 : 46;
        return L.divIcon({
          className: 'spot-cluster' + (allVisited ? ' visited' : '') + (rareLeft ? ' rare' : ''),
          html: `<span>${ms.length}</span>`,
          iconSize: [size, size],
        });
      },
    })
  : L.layerGroup();
spotLayer.addTo(map);

const spotMarkers = {};
function addSpotMarker(s) {
  // タップすると名前のフキダシ、フキダシをタップすると詳細カード
  const m = L.marker([s.lat, s.lng], { icon: spotIcon(s, false) })
    .bindPopup(`<div class="spot-pop"><b>${s.rare ? '✨ ' : ''}${spotType(s).icon} ${esc(s.name)}</b><span>タップで詳細 ›</span></div>`,
      { closeButton: false, offset: [0, -10], autoPanPadding: [20, 20] })
    .addTo(spotLayer);
  m.on('popupopen', e => {
    e.popup.getElement().querySelector('.spot-pop').onclick = () => { m.closePopup(); openSpotDetail(s.id); };
  });
  m.visited = false; m.fav = false; m.todayVisited = false; m.rare = !!s.rare;
  m.on('click', () => { if (demo) setPosition(s.lat, s.lng, 0, true); }); // テストモードではアイコンをタップするとその場所へ
  spotMarkers[s.id] = m;
}

// ===== 道の駅の印（角丸の四角に「道」。未訪問は紫のふち、訪問済みは黄緑のふち、今日訪問したものは半透明） =====
function michiIcon(visited, todayVisited, fav) {
  return L.divIcon({
    className: `michi-marker${visited ? ' visited' : ''}${todayVisited ? ' today' : ''}${fav ? ' fav' : ''}`,
    html: '<span>道</span>',
    iconSize: [24, 24], iconAnchor: [12, 12],
  });
}
// 近くにある道の駅は、観光地とは別の四角い丸にまとめる
const michiLayer = L.markerClusterGroup
  ? L.markerClusterGroup({
      maxClusterRadius: 18, disableClusteringAtZoom: 11, showCoverageOnHover: false, spiderfyOnMaxZoom: false, animate: false,
      iconCreateFunction: cluster => {
        const ms = cluster.getAllChildMarkers();
        return L.divIcon({ className: 'michi-cluster' + (ms.every(m => m.visited) ? ' visited' : ''),
          html: `<span>${ms.length}</span>`, iconSize: [26, 26] });
      },
    })
  : L.layerGroup();
let showMichi = true;
try { showMichi = localStorage.getItem(SHOW_MICHI_KEY) !== '0'; } catch (e) {}
if (showMichi) michiLayer.addTo(map);
const michiMarkers = {};
function addMichiMarker(m) {
  const mk = L.marker([m.lat, m.lng], { icon: michiIcon(false, false, false) })
    .bindPopup(`<div class="spot-pop"><b>🚗 ${esc(m.name)}</b><span>タップで詳細 ›</span></div>`,
      { closeButton: false, offset: [0, -10], autoPanPadding: [20, 20] })
    .addTo(michiLayer);
  mk.on('popupopen', e => {
    e.popup.getElement().querySelector('.spot-pop').onclick = () => { mk.closePopup(); openSpotDetail(m.id); };
  });
  mk.visited = false; mk.todayVisited = false; mk.fav = false;
  mk.on('click', () => { if (demo) setPosition(m.lat, m.lng, 0, true); }); // テストモードではタップした道の駅にいることにする
  michiMarkers[m.id] = mk;
}

// あとから観光地兼道の駅にした道の駅（例：まえばし赤城）に、道の駅として記録があれば観光地の記録へ移す
// （観光地兼道の駅は観光地の記録で数えるため。観光地の記録がすでにあれば、回数の多い方・日付の広い方にまとめる）
function migrateDualMichi() {
  const st = demo ? realState : state;
  if (!st) return;
  let changed = false;
  MICHI.forEach(m => {
    if (!m.spot || !st.michi[m.id]) return;
    const mv = st.michi[m.id], sv = st.spots[m.spot], s = spotById(m.spot);
    if (!sv) {
      st.spots[m.spot] = Object.assign({}, mv, { name: s ? s.name : mv.name, city: (s && s.city) || mv.city || '' });
    } else {
      sv.first = sv.first < mv.first ? sv.first : mv.first;
      sv.last = sv.last > mv.last ? sv.last : mv.last;
      sv.count = Math.max(sv.count, mv.count);
      if (!sv.memo && mv.memo) sv.memo = mv.memo;
    }
    delete st.michi[m.id];
    if (st.favs[m.id]) { if (!st.favs[m.spot]) st.favs[m.spot] = st.favs[m.id]; delete st.favs[m.id]; }
    changed = true;
  });
  if (changed) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch (e) {}
    listDirty = true;
  }
}

// spots.json を読み込む（起動時。失敗したら少し待って読み直す）
let spotsRetry = 0;
function loadSpots() {
  fetch(SPOTS_URL, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      SPOTS = (d.spots || []).filter(s => s && s.id && isFinite(s.lat) && isFinite(s.lng));
      SPOTS.forEach(s => { spotIndex[s.id] = s; if (s.desc) SPOT_DESC[s.id] = s.desc; addSpotMarker(s); });
      // 道の駅（観光地を兼ねるものは観光地の印を使うので、道の駅の印は置かない）
      MICHI = (d.michi || []).filter(m => m && m.id && isFinite(m.lat) && isFinite(m.lng));
      MICHI.forEach(m => { michiIndex[m.id] = m; if (m.desc) SPOT_DESC[m.id] = m.desc; if (!m.spot) addMichiMarker(m); });
      migrateDualMichi();
      if (MICHI.length) map.attributionControl.addAttribution('道の駅：<a href="https://nlftp.mlit.go.jp/ksj/" target="_blank">国土数値情報（道の駅データ）</a>を加工・© OpenStreetMap contributors');
      listDirty = true;
      render();
    })
    .catch(e => {
      console.warn('観光地データを読み込めませんでした', e);
      setTimeout(loadSpots, Math.min(5000 * 2 ** spotsRetry++, 60000));
    });
}

// ===== 駅（stations.json を必要になったときに読み込む） =====
let STATIONS = null;              // [{ id, name, pref, city, lat, lng, lines:[路線id], p:[[lat,lng],…]? }]
let LINES = [];                   // [{ id, label, color, st:[駅id] }]
let STATION_AREA = '';            // データに入っている範囲（例：群馬県）
const stationIndex = {}, lineIndex = {};
let stationsLoading = null, stationsFailedAt = 0;
function loadStations() {
  if (STATIONS || stationsLoading) return;
  if (Date.now() - stationsFailedAt < 30000) return; // 失敗したら30秒は再挑戦しない
  stationsLoading = fetch(STATIONS_URL, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      LINES = d.lines || [];
      LINES.forEach(l => { lineIndex[l.id] = l; });
      (d.stations || []).forEach(s => { stationIndex[s.id] = s; });
      STATIONS = d.stations || [];
      STATION_AREA = d.area || '';
      map.attributionControl.addAttribution('駅：<a href="https://nlftp.mlit.go.jp/ksj/" target="_blank">国土数値情報（鉄道データ）</a>を加工');
      listDirty = true;
      refreshStationLayer();
      render();
    })
    .catch(e => { stationsFailedAt = Date.now(); console.warn('駅データを読み込めませんでした', e); })
    .finally(() => { stationsLoading = null; });
}
const stationColor = st => (lineIndex[st.lines[0]] || {}).color || '#555';
const lineChips = st => st.lines.map(id => lineIndex[id])
  .filter(Boolean).map(l => `<span class="line-chip"><i style="background:${esc(l.color)}"></i>${esc(l.label)}</span>`).join('');

// 駅の点は「路線の色の小さな丸」として、観光地のアイコンより上の層（stations）に SVG で描く。
// canvas だと層全体が1枚の板になり、下の観光地アイコンがタップできなくなるため SVG にしている（SVG の余白はタップを通す。CSS参照）。
// 拡大したとき（STATION_MIN_ZOOM 以上）に、画面に入っている駅だけ描く
const stationRenderer = L.svg({ pane: 'stations', padding: 0.3 });
const stationLayer = L.layerGroup().addTo(map);
let showStations = true;
try { showStations = localStorage.getItem(SHOW_STATIONS_KEY) !== '0'; } catch (e) {}
let stationSig = '';
function refreshStationLayer() {
  stationLayer.clearLayers();
  updateStationToggle();
  if (!STATIONS || !showStations || map.getZoom() < STATION_MIN_ZOOM) return;
  const b = map.getBounds().pad(0.3);
  STATIONS.forEach(st => {
    if (!b.contains([st.lat, st.lng])) return;
    const v = state.stations[st.id], color = stationColor(st);
    const alpha = v && v.last === today() ? 0.45 : 1; // 今日訪問した駅は半透明（日付が変わると元に戻る）
    // 未訪問：路線の色で塗りつぶし ／ 訪問済み：白抜き（路線の色の太い縁）
    const m = L.circleMarker([st.lat, st.lng], v
      ? { renderer: stationRenderer, radius: 6, color, weight: 3, fillColor: '#fff', opacity: alpha, fillOpacity: alpha, bubblingMouseEvents: false }
      : { renderer: stationRenderer, radius: 6, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1, bubblingMouseEvents: false });
    m.bindPopup(`<div class="st-pop"><b>🚉 ${esc(st.name)}駅</b><div>${lineChips(st)}</div>` +
      `<span>${v ? `✅ 訪問済み ${v.count}回` : '未訪問'}</span></div>`, { closeButton: false, offset: [0, -4] });
    m.on('click', () => { if (demo) setPosition(st.lat, st.lng, 0, true); }); // テストモードではタップした駅にいることにする
    m.addTo(stationLayer);
  });
}
map.on('moveend', refreshStationLayer);

// 地図右上の「駅」表示ON/OFFボタン
let stationToggleBtn = null;
const StationToggle = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const b = L.DomUtil.create('button', 'map-toggle');
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener('click', () => {
      showStations = !showStations;
      try { localStorage.setItem(SHOW_STATIONS_KEY, showStations ? '1' : '0'); } catch (e) {}
      if (showStations) loadStations();
      refreshStationLayer();
    });
    stationToggleBtn = b;
    return b;
  },
});
map.addControl(new StationToggle());
// 地図右上の「道の駅」表示ON/OFFボタン（駅のボタンの下）
let michiToggleBtn = null;
const MichiToggle = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const b = L.DomUtil.create('button', 'map-toggle michi-toggle');
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener('click', () => {
      showMichi = !showMichi;
      try { localStorage.setItem(SHOW_MICHI_KEY, showMichi ? '1' : '0'); } catch (e) {}
      if (showMichi) michiLayer.addTo(map); else map.removeLayer(michiLayer);
      updateMichiToggle();
    });

    return b;

});
map.addControl(new MichiToggle());
function updateMichiToggle() {
  if (!michiToggleBtn) return;
  michiToggleBtn.classList.toggle('off', !showMichi);
  michiToggleBtn.innerHTML = showMichi ? '🚗 道の駅：ON' : '🚗 道の駅：OFF';
}
updateMichiToggle();
function updateStationToggle() {
  const b = stationToggleBtn;
  if (!b) return;
  b.classList.toggle('off', !showStations);
  b.innerHTML = showStations
    ? '🚉 駅：ON' + (map.getZoom() < STATION_MIN_ZOOM ? '<small>拡大すると表示</small>' : '')
    : '🚉 駅：OFF';
}
updateStationToggle();

// ===== 現在地 =====
let current = null;      // { lat, lng, acc, muni }
let lastLookup = null;   // 最後に市町村を調べた地点
let lookupSeq = 0;
let watchId = null;
let demo = false;
let realState = null;    // テストモード中に本物の記録を退避しておく場所
let firstFix = true;
let lookupPending = false; // 市町村を調べている最中か
let retryTimer = null;
let failCount = 0;

const $ = id => document.getElementById(id);

// 観光地の案内が出たり消えたりして地図の高さが変わったら、地図を描き直す
if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe($('map'));

function startWatch() {
  if (!window.isSecureContext) {
    showPlace('HTTPSで開いてください', '', '位置情報は https:// のページでしか使えません。テストモードなら試せます。');
    return;
  }
  if (!navigator.geolocation) { showPlace('位置情報に未対応', '', ''); return; }
  stopWatch();
  $('sub').textContent = 'GPSを探しています…';
  watchId = navigator.geolocation.watchPosition(
    p => setPosition(p.coords.latitude, p.coords.longitude, p.coords.accuracy, false, p.coords.speed),
    err => {
      const msg = err.code === 1
        ? '位置情報の利用が許可されていません。Chromeのアドレスバー左のアイコン →「権限」から許可してください。'
        : '位置情報を取得できませんでした（' + err.message + '）';
      $('sub').textContent = msg;
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
  );
}
function stopWatch() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }

// ===== 移動の速さ（電車で通過しただけのチェックインを防ぐ） =====
let fixes = [];          // 最近の位置 { lat, lng, t }
let stillTimer = null;
// GPSが返す速度（m/s）があればそれを使い、無ければ数秒前の位置との差から計算する（km/h。分からなければ null）
function estimateSpeed(lat, lng, gpsSpeed) {
  const now = Date.now();
  fixes.push({ lat, lng, t: now });
  fixes = fixes.filter(f => now - f.t < 30000);
  if (typeof gpsSpeed === 'number' && isFinite(gpsSpeed)) return gpsSpeed * 3.6;
  const old = fixes.filter(f => now - f.t >= SPEED_WINDOW_MS).pop();
  if (!old) return null;
  return L.latLng(lat, lng).distanceTo([old.lat, old.lng]) / ((now - old.t) / 1000) * 3.6;
}
// 今の速さ（km/h）。しばらく位置が更新されていなければ止まっているとみなす
function currentSpeed() {
  if (!current) return null;
  if (current.speed !== null) return current.speed;
  return Date.now() - current.t > STILL_AFTER_MS ? 0 : null;
}
// 観光地・駅のチェックインを止める理由（動いていなければ null）
function movingBlock() {
  if (demo) return null;
  const sp = currentSpeed();
  if (sp === null) return '速度を確認中…';
  if (sp > MAX_SPEED_KMH) return `移動中はチェックインできません（時速約${Math.round(sp)}km）`;
  return null;
}

function setPosition(lat, lng, acc, force, gpsSpeed) {
  const ll = L.latLng(lat, lng);
  marker.setLatLng(ll).addTo(map);
  accCircle.setLatLng(ll).setRadius(acc || 0).addTo(map);
  if (firstFix || demo) { map.setView(ll, Math.max(map.getZoom(), 14)); firstFix = false; }
  const prevMuni = current && current.muni;
  current = { lat, lng, acc, muni: prevMuni, t: Date.now(), speed: demo ? 0 : estimateSpeed(lat, lng, gpsSpeed) };
  // 速さが分からないときは、少し待って位置が変わらなければ「止まっている」として描き直す
  clearTimeout(stillTimer);
  if (current.speed === null) stillTimer = setTimeout(render, STILL_AFTER_MS + 500);
  loadStations(); // 近くの駅を調べるため、駅データを読み込んでおく
  $('sub').textContent = acc ? `GPS精度 約${Math.round(acc)}m` : 'テスト地点';
  if (force || !lastLookup || ll.distanceTo(lastLookup) > LOOKUP_MOVE_M) {
    lastLookup = ll;
    lookup(lat, lng);
  }
  render(); // GPS精度が変わるとチェックインの可否も変わるので毎回更新
}

// ===== 市町村の判定（国土地理院 → だめならOpenStreetMap） =====
async function lookup(lat, lng) {
  const seq = ++lookupSeq;
  clearTimeout(retryTimer);
  lookupPending = true;
  let muni = null;
  try { muni = await lookupGsi(lat, lng); } catch (e) {}
  if (!muni) { try { muni = await lookupOsm(lat, lng); } catch (e) {} }
  if (seq !== lookupSeq) return; // 古い結果は捨てる
  lookupPending = false;
  current.muni = muni;
  if (muni && muni.source === 'gsi') {
    failCount = 0;
  } else {
    // 地理院で判定できなかったら、その場にいても少し待って自動で再試行する
    const wait = Math.min(RETRY_MS * 2 ** failCount, RETRY_MAX_MS);
    failCount++;
    retryTimer = setTimeout(() => {
      if (!current) return;
      lastLookup = L.latLng(current.lat, current.lng);
      lookup(current.lat, current.lng);
    }, wait);
  }
  render();
}

async function lookupGsi(lat, lng) {
  const r = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`);
  const j = await r.json();
  if (!j.results || !j.results.muniCd) return null;
  const code = String(parseInt(j.results.muniCd, 10));
  const entry = GSI.MUNI_ARRAY && GSI.MUNI_ARRAY[code];
  if (!entry) return null;
  const parts = entry.split(',');           // 例: "13,東京都,13104,新宿区"
  const pref = parts[1];
  const { city, ward } = splitMuniName(parts[3]);
  return { pref, city, ward, area: j.results.lv01Nm || '', source: 'gsi' };
}
// muni.js の市町村名を、このアプリの数え方の市町村名にする
// 例: "札幌市　中央区" → 札幌市（区は ward）、"石狩郡　当別町" → 当別町、"新宿区" → 新宿区
function splitMuniName(raw) {
  const names = String(raw).split(/[\s　]+/).filter(Boolean);
  let city = names.join(''), ward = '';
  if (names.length >= 2) {
    if (/郡$/.test(names[0])) city = names[names.length - 1];          // 郡は省いて町村名だけ
    else if (/市$/.test(names[0]) && /区$/.test(names[1])) { city = names[0]; ward = names[1]; } // 政令市は市単位
  }
  return { city, ward };
}

async function lookupOsm(lat, lng) {
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=10&accept-language=ja`);
  const j = await r.json();
  const a = j.address || {};
  const pref = a.province || a.state || '';
  const city = a.city || a.town || a.village || a.municipality || '';
  if (!pref || !city) return null;
  // 地理院と名前の付け方が違うことがあり二重登録の原因になるので、表示専用にする
  return { pref, city, ward: a.city_district || '', area: '', source: 'osm' };
}

// ===== チェックイン =====
const today = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD
const keyOf = m => m.pref + '/' + m.city;

// チェックインできない理由（できるなら null）
function checkinBlock() {
  if (!current || !current.muni) return 'チェックイン';
  const m = current.muni, v = state.visited[keyOf(m)];
  if (m.source !== 'gsi') return '予備の判定中のためチェックイン不可';
  if (!demo && current.acc > MAX_ACC_M) return `GPS精度が低いです（${MAX_ACC_M}m以内で可能）`;
  if (v && v.last === today()) return '今日はチェックイン済み';
  return null;
}

$('checkin').addEventListener('click', () => {
  if (checkinBlock()) return;
  const m = current.muni, k = keyOf(m), v = state.visited[k];
  let gain, title;
  if (!v) {
    gain = XP_NEW; title = '🎉 初訪問！';
    state.visited[k] = { pref: m.pref, city: m.city, first: today(), last: today(), count: 1 };
  } else {
    gain = XP_REVISIT; title = 'おかえりなさい';
    v.last = today(); v.count++;
  }
  addLog('muni', k, m.city, m.pref, gain);
  const before = levelOf(state.xp);
  state.xp += gain;
  save();
  const after = levelOf(state.xp);
  toast(`${title}<br>${esc(m.city)}<div class="big">+${gain} XP</div>` +
        (after > before ? `<div>⬆ レベルアップ！ Lv${after}</div>` : '') +
        (demo ? '<div style="font-size:12px;opacity:.8">テストモードのため保存されません</div>' : ''));
  render();
});

// ===== 観光地チェックイン =====
// 現在地からいちばん近い観光地と距離（m）
function nearestSpot() {
  if (!current) return null;
  const here = L.latLng(current.lat, current.lng);
  let best = null;
  SPOTS.forEach(s => {
    const d = here.distanceTo([s.lat, s.lng]);
    if (!best || d < best.dist) best = { spot: s, dist: d };
  });
  return best;
}

// 観光地にチェックインできない理由（できるなら null）
function spotBlock(n) {
  if (!n || n.dist > SPOT_RADIUS_M) return '範囲外';
  if (!demo && current.acc > MAX_ACC_M) return `GPS精度が低いです（${MAX_ACC_M}m以内で可能）`;
  const v = state.spots[n.spot.id];
  if (v && v.last === today()) return '今日はチェックイン済み';
  return movingBlock();
}

$('spotCheckin').addEventListener('click', () => {
  const n = nearestSpot();
  if (spotBlock(n)) return;
  const s = n.spot, v = state.spots[s.id];
  let gain, title;
  if (!v) {
    gain = s.rare ? XP_RARE_NEW : XP_SPOT_NEW; title = s.rare ? '✨ レアスポット発見！' : '📸 観光地に到着！';
    state.spots[s.id] = { name: s.name, pref: s.pref, city: s.city || '', first: today(), last: today(), count: 1 };
  } else {
    gain = XP_SPOT_REVISIT; title = 'また来ました';
    v.last = today(); v.count++;
  }
  // メダルの抽選（何回目の訪問かで RATE の範囲が変わる。機能を入れる前の訪問も回数には数える）
  const rec = state.spots[s.id], prevBest = bestMedal(rec), rate = drawMedal(rec.count);
  (rec.medals = medalsOf(rec)).push({ r: rate, d: today() });
  addLog('spot', s.id, s.name, s.pref, gain, rate);
  const before = levelOf(state.xp);
  state.xp += gain;
  save();
  const after = levelOf(state.xp);
  toast(`${title}<br>${esc(s.name)}<div class="big">+${gain} XP</div>` +
        `<div class="toast-medal">${medalBadge(rate, 'big')}<div><b>${medalName(rate)}</b>　RATE ${rate}` +
        (prevBest !== null && rate < prevBest ? '<br>🎉 ベスト更新！' : '') + '</div></div>' +
        (after > before ? `<div>⬆ レベルアップ！ Lv${after}</div>` : '') +
        (demo ? '<div style="font-size:12px;opacity:.8">テストモードのため保存されません</div>' : ''), 3500);
  render();
});

const fmtDist = m => m < 1000 ? `約${Math.round(m / 10) * 10}m` : `約${(m / 1000).toFixed(1)}km`;

function renderSpots() {
  // 地図の印（訪問済みかどうかが変わったものだけ描き直す）
  const changed = [];
  SPOTS.forEach(s => {
    const m = spotMarkers[s.id], v = state.spots[s.id], visited = !!v;
    const fav = !!state.favs[s.id], todayVisited = !!v && v.last === today(); // 日付が変わると次の描画で元に戻る
    if (m.visited !== visited || m.fav !== fav || m.todayVisited !== todayVisited) {
      m.setIcon(spotIcon(s, visited, fav, todayVisited)); m.visited = visited; m.fav = fav; m.todayVisited = todayVisited; changed.push(m);
    }
  });
  // まとめた丸の色（全部訪問済みなら灰色）も描き直す
  if (changed.length && spotLayer.refreshClusters) spotLayer.refreshClusters(changed);

  // 道の駅の印（観光地を兼ねるものは観光地の印なので対象外）
  const mChanged = [];
  MICHI.forEach(m => {
    const mk = michiMarkers[m.id];
    if (!mk) return;
    const v = state.michi[m.id], visited = !!v, todayVisited = !!v && v.last === today(), fav = !!state.favs[m.id];
    if (mk.visited !== visited || mk.todayVisited !== todayVisited || mk.fav !== fav) {
      mk.setIcon(michiIcon(visited, todayVisited, fav)); mk.visited = visited; mk.todayVisited = todayVisited; mk.fav = fav; mChanged.push(mk);
    }
  });
  if (mChanged.length && michiLayer.refreshClusters) michiLayer.refreshClusters(mChanged);

  // 近くの観光地
  const n = nearestSpot();
  const box = $('spotBox'), hint = $('spotHint');
  if (n && n.dist <= SPOT_RADIUS_M && state.spots[n.spot.id] && state.spots[n.spot.id].last === today()) {
    // 今日チェックイン済み：カードは出さず、1行の「済み」表示にまとめる
    box.hidden = true; hint.textContent = '';
    doneChips.push({ text: `✅ ${spotType(n.spot).icon} ${n.spot.name}`, spot: n.spot.id });
  } else if (n && n.dist <= SPOT_RADIUS_M) {
    const v = state.spots[n.spot.id], block = spotBlock(n);
    box.hidden = false; hint.textContent = '';
    $('spotName').textContent = `${n.spot.rare ? '✨ ' : ''}${spotType(n.spot).icon} ${n.spot.name}`;
    box.classList.toggle('rare', !!n.spot.rare);
    $('spotStatus').innerHTML = v
      ? `<span class="status old">訪問済み ${v.count}回</span>`
      : '<span class="status new">未訪問！</span>';
    $('spotSub').textContent = `${n.spot.rare ? 'レアスポット・' : ''}${spotType(n.spot).label}・ここから ${fmtDist(n.dist)}`;
    $('spotCheckin').disabled = !!block;
    $('spotCheckin').textContent = block || `観光地チェックイン +${v ? XP_SPOT_REVISIT : n.spot.rare ? XP_RARE_NEW : XP_SPOT_NEW} XP`;
  } else {
    box.hidden = true;
    hint.textContent = n && n.dist <= SPOT_HINT_M
      ? `🧭 近くの観光地：${spotType(n.spot).icon} ${n.spot.name}（${fmtDist(n.dist)}）` : '';
  }
}

// ===== 駅チェックイン =====
// 現在地からいちばん近い駅と距離（m）。ホームが離れている駅（p）は一番近いホームまでの距離
function nearestStation() {
  if (!current || !STATIONS) return null;
  const here = L.latLng(current.lat, current.lng);
  let best = null;
  STATIONS.forEach(st => {
    let d = here.distanceTo([st.lat, st.lng]);
    (st.p || []).forEach(pt => { d = Math.min(d, here.distanceTo(pt)); });
    if (!best || d < best.dist) best = { st, dist: d };
  });
  return best;
}

// 駅にチェックインできない理由（できるなら null）
function stationBlock(n) {
  if (!n || n.dist > STATION_RADIUS_M) return '範囲外';
  if (!demo && current.acc > MAX_ACC_M) return `GPS精度が低いです（${MAX_ACC_M}m以内で可能）`;
  const v = state.stations[n.st.id];
  if (v && v.last === today()) return '今日はチェックイン済み';
  return movingBlock();
}

  const after = levelOf(state.xp);
  toast(`${title}<br>${esc(st.name)}駅<div class="big">+${gain} XP</div>` +
        (after > before ? `<div>⬆ レベルアップ！ Lv${after}</div>` : '') +

});

// 駅の近く（STATION_RADIUS_M 以内）にいるときだけ案内カードを出す
function renderStations() {

// ===== 道の駅チェックイン（観光地を兼ねる道の駅は観光地としてチェックインするので、ここでは扱わない） =====
function nearestMichi() {
  if (!current || !MICHI.length) return null;

  MICHI.forEach(m => {

    const d = here.distanceTo([m.lat, m.lng]);
    if (!best || d < best.dist) best = { m, dist: d };

}

}

// ===== 市町村の総数（地理院の muni.js から都道府県ごとに数える。政令市は1市、郡は省く、今の数え方のまま） =====
let MUNI_BY_PREF = null;
function muniByPref() {
  if (MUNI_BY_PREF) return MUNI_BY_PREF;
  if (!GSI.MUNI_ARRAY) return null;
  const m = {};
  for (const [code, entry] of Object.entries(GSI.MUNI_ARRAY)) {
    const c = parseInt(code, 10);
    if (c >= 1695 && c <= 1700) continue; // 北方領土の6村は数えない
    const parts = String(entry).split(',');
    if (parts.length < 4 || !parts[1] || !parts[3]) continue;
    const { city } = splitMuniName(parts[3]);
    if (city) (m[parts[1]] = m[parts[1]] || new Set()).add(city);
  }
  MUNI_BY_PREF = {};
  for (const [p, set] of Object.entries(m)) MUNI_BY_PREF[p] = [...set];
  return MUNI_BY_PREF;
}

// 都道府県ごとの達成状況 [訪問数, 総数]（総数が分からないときは null）
function prefStats(p) {
  const mb = muniByPref();
  const muniVisited = Object.values(state.visited).filter(v => v.pref === p).length;
  const spots = SPOTS.filter(s => spotPrefs(s).includes(p));
  const sts = STATIONS ? STATIONS.filter(s => s.pref === p) : null;
  return {
    muni: [muniVisited, mb && mb[p] ? mb[p].length : null],
    spot: [spots.filter(s => state.spots[s.id]).length, spots.length],
    st: [sts ? sts.filter(s => state.stations[s.id]).length : 0, sts ? sts.length : null],
    michi: (ms => [ms.filter(m => michiRec(m)).length, ms.length])(MICHI.filter(m => m.pref === p)),
  };
}

// ===== ページの部品 =====
const cBar = (n, total, color) =>
  `<div class="c-bar"><div style="width:${total ? n / total * 100 : 0}%${color ? ';background:' + esc(color) : ''}"></div></div>`;
const cNum = (n, total, unit) => {
  const done = total > 0 && n === total;
  return `<span class="c-num${done ? ' done' : ''}">${n} / ${total}${unit || ''}${done ? ' 🎉' : ''}</span>`;
};
// 次の階層へ進む行。o = { n, total, unit, color, note }
function navRow(nav, arg, titleHtml, o) {
  o = o || {};
  const hasNum = typeof o.total === 'number' && o.total > 0;
  const sub = [hasNum ? cNum(o.n, o.total, o.unit) : '', o.note || ''].filter(Boolean).join('　');
  return `<button class="nav-row" data-nav="${esc(nav)}" data-arg="${esc(arg || '')}"><div class="n-main">` +
    `<div class="n-title">${titleHtml}</div>${sub ? `<div class="n-sub">${sub}</div>` : ''}` +
    `${hasNum ? cBar(o.n, o.total, o.color) : ''}</div><span class="n-arrow">›</span></button>`;
}
// 一覧の1行。o = { mark, name, sub, right, attrs, todo }
const item = o =>
  `<div class="item${o.attrs ? ' tap' : ''}${o.todo ? ' todo' : ''}" ${o.attrs || ''}><span class="i-mark">${o.mark || ''}</span>` +
  `<div class="i-main"><div class="i-name">${o.name}</div>${o.sub ? `<div class="i-sub">${o.sub}</div>` : ''}</div>` +
  `<div class="i-right">${o.right || ''}</div></div>`;
const items = arr => arr.length ? `<div class="items">${arr.join('')}</div>` : '<div class="empty">まだありません</div>';
const visitRight = v => v ? `${esc(v.first)}〜<br>${v.count}回` : '未訪問';
const lineChip = l => `<span class="line-chip"><i style="background:${esc(l.color)}"></i></span>`;
// 観光地の行（タップで詳細カード）
const spotItem = (s, v) => item({
  mark: v ? '✅' : '・', todo: !v, attrs: `data-spot="${esc(s.id)}"`,
  name: `${spotType(s).icon} ${esc(s.name)}${s.rare ? ' ✨' : ''}${state.favs[s.id] ? ' <span style="color:#f0b400">★</span>' : ''}${v && v.memo ? ' 📝' : ''}${bestBadge(v)}`,
  sub: esc([spotType(s).label, s.city].filter(Boolean).join('・')), right: visitRight(v),
});
// 一覧の名前の後ろに付ける、ベストメダルの小さな丸（メダルが無ければ何も付けない）
const bestBadge = v => { const b = bestMedal(v); return b === null ? '' : ' ' + medalBadge(b); };
// 駅の行（タップで地図をその駅へ）
const stationItem = (st, sub) => {
  const v = state.stations[st.id];
  return item({ mark: v ? '✅' : '・', todo: !v, attrs: `data-station="${esc(st.id)}"`, name: `${esc(st.name)}駅`, sub, right: visitRight(v) });
};
const WEEK = '日月火水木金土';
const fmtDay = d => { const [y, m, dd] = d.split('-').map(Number); return `${y}年${m}月${dd}日（${WEEK[new Date(y, m - 1, dd).getDay()]}）`; };

// 達成状況の行（左：名前と達成率％、右：アイコン＋太字の「訪問数 / 総数」と小さなバーを縦に並べる）
// stats = [{ icon, n, total, unit }]。total が無い（0・null）項目は右側に「—」で出し、達成率の計算には入れない
const STAT_COLOR = { muni: '#1e6f5c', spot: '#7b4fc9', station: '#1F5FB0', michi: '#3B6D11' };
function statRow(nav, arg, titleHtml, stats, note) {
  const valid = stats.filter(s => s.total > 0);
  const N = valid.reduce((a, s) => a + s.n, 0), T = valid.reduce((a, s) => a + s.total, 0);
  const allDone = T > 0 && N === T;
  const pct = T ? (allDone ? 100 : Math.floor(N / T * 1000) / 10) : null; // 小数第1位まで（切り捨て）
  const right = stats.map(s => {
    if (!(s.total > 0)) return `<span class="s-ic">${s.icon}</span><span class="s-num none">—</span><span></span>`;
    const done = s.n === s.total, w = s.n / s.total * 100;
    return `<span class="s-ic">${s.icon}</span>` +
      `<span class="s-num${done ? ' done' : s.n ? ' on' : ''}">${s.n}<span class="t"> / ${s.total}${s.unit || ''}</span>${done ? ' 🎉' : ''}</span>` +
      `<span class="s-bar"><div style="width:${w}%;${done ? '' : s.color ? 'background:' + esc(s.color) : ''}"${done ? ' class="done"' : ''}></div></span>`;
  }).join('');
  return `<button class="nav-row stat-row${N === 0 ? ' zero' : ''}${allDone ? ' all-done' : ''}" data-nav="${esc(nav)}" data-arg="${esc(arg || '')}">` +
    `<div class="s-left"><div class="s-name">${titleHtml}</div>` +
    `<div class="s-pct">${pct === null ? '—' : pct}<small>${pct === null ? '' : '%'}</small>${allDone ? ' 🎉' : ''}</div>` +
    `${note ? `<div class="n-sub">${note}</div>` : ''}</div>` +
    `<div class="s-right">${right}</div><span class="n-arrow">›</span></button>`;
}
// 都道府県の4項目（市町村・観光地・駅・道の駅）

// 道の駅の一覧の1行（観光地兼道の駅は観光地の詳細カードを開く）
function michiItem(m) {

// ===== 各ページ（name → arg を受け取って { title, html } を返す） =====
const VIEWS = {
  // コンプリート一覧：都道府県／鉄道路線
  complete() {

    const stN = STATIONS ? STATIONS.filter(s => state.stations[s.id]).length : 0;
    const lineDone = LINES.filter(l => l.st.every(id => state.stations[id])).length;
    const prefN = PREF_ORDER.filter(prefVisited).length;
    return { title: '🏆 コンプリート一覧', html:
      statRow('prefs', '', '🗾 都道府県', [
        { icon: '🏙️', n: muniN, total: muniT, color: STAT_COLOR.muni },
        { icon: '📍', n: spN, total: SPOTS.length, color: STAT_COLOR.spot },
        { icon: '🚉', n: stN, total: STATIONS ? STATIONS.length : 0, color: STAT_COLOR.station },
        { icon: '🚗', n: MICHI.filter(m => michiRec(m)).length, total: MICHI.length, color: STAT_COLOR.michi },
      ], `訪問した都道府県 ${prefN} / 47`) +
      statRow('lines', '', '🚉 鉄道路線', [
        { icon: '🏁', n: lineDone, total: STATIONS ? LINES.length : 0, unit: '路線', color: STAT_COLOR.station },
        { icon: '🚉', n: stN, total: STATIONS ? STATIONS.length : 0, unit: '駅', color: STAT_COLOR.station },
      ], STATIONS ? '🏁＝全駅制覇した路線' : '駅データを読み込み中…') };
  },
  // 都道府県の一覧（北海道〜沖縄）。filter = 'all'（すべて）／'visited'（行ったことのある県だけ）
  prefs(filter) {
    filter = filter || 'all';
    const visited = PREF_ORDER.filter(prefVisited);
    const list = filter === 'visited' ? visited : PREF_ORDER;
    const chips = `<div class="chips"><button class="chip${filter === 'all' ? ' on' : ''}" data-filter="all">すべて（47）</button>` +
      `<button class="chip${filter === 'visited' ? ' on' : ''}" data-filter="visited">行ったことのある県だけ（${visited.length}）</button></div>`;
    return { title: '🗾 都道府県', html: chips +
      '<div class="list-note">🏙️ 市町村　📍 観光地　🚉 鉄道駅　🚗 道の駅。％はこれらを合わせた達成率。タップで詳しく見られます</div>' +
      (list.length ? list.map(p => statRow('pref', p, esc(p), prefStatItems(prefStats(p)))).join('')
        : '<div class="empty">まだ行ったことのある県がありません</div>') };
  },
  // 1つの都道府県：市町村／観光地／鉄道駅
  pref(p) {
    const s = prefStats(p);
    return { title: p, html:
      statRow('prefMuni', p, '🏙️ 市町村', [{ icon: '🏙️', n: s.muni[0], total: s.muni[1], color: STAT_COLOR.muni }],
        s.muni[1] != null ? '' : '市町村のデータを読み込めませんでした') +
      statRow('prefSpots', p, '📍 観光地', [{ icon: '📍', n: s.spot[0], total: s.spot[1], color: STAT_COLOR.spot }],
        s.spot[1] ? '' : 'まだ観光地が登録されていません') +
      statRow('prefStations', p, '🚉 鉄道駅', [{ icon: '🚉', n: s.st[0], total: s.st[1], unit: '駅', color: STAT_COLOR.station }],
        !STATIONS ? '駅データを読み込み中…' : s.st[1] ? '' : 'まだ駅データがありません') +
      statRow('prefMichi', p, '🚗 道の駅', [{ icon: '🚗', n: s.michi[0], total: s.michi[1], color: STAT_COLOR.michi }],
        s.michi[1] ? '' : 'まだ道の駅が登録されていません') };
  },
  prefMichi(p) {
    const list = MICHI.filter(m => m.pref === p).sort((a, b) => (michiRec(b) ? 1 : 0) - (michiRec(a) ? 1 : 0));
    const n = list.filter(m => michiRec(m)).length;
    return { title: `${p}の道の駅`, html: `<div class="sec-h">${cNum(n, list.length)}　タップで詳細</div>` +
      items(list.map(michiItem)) };
  },
  prefMuni(p) {
    const mb = muniByPref(), names = (mb && mb[p]) || [];
    const vis = Object.values(state.visited).filter(v => v.pref === p);
    const extra = vis.filter(v => !names.includes(v.city)).map(v => v.city); // データに無い名前で記録されたもの
    const all = names.concat(extra);
    const n = all.filter(c => state.visited[p + '/' + c]).length;
    return { title: `${p}の市町村`, html: `<div class="sec-h">${cNum(n, all.length)}</div>` + items(all.map(c => {
      const v = state.visited[p + '/' + c];
      return item({ mark: v ? '✅' : '・', todo: !v, name: esc(c), right: visitRight(v) });
    })) };
  },
  prefSpots(p) {
    const list = SPOTS.filter(s => spotPrefs(s).includes(p)).sort((a, b) => (state.spots[b.id] ? 1 : 0) - (state.spots[a.id] ? 1 : 0));
    const n = list.filter(s => state.spots[s.id]).length;
    return { title: `${p}の観光地`, html: `<div class="sec-h">${cNum(n, list.length)}　タップで詳細</div>` +
      items(list.map(s => spotItem(s, state.spots[s.id]))) };
  },
  prefStations(p) {
    if (!STATIONS) return { title: `${p}の鉄道駅`, html: '<div class="empty">駅データを読み込み中…</div>' };
    const order = id => LINES.findIndex(l => l.id === id);
    const list = STATIONS.filter(s => s.pref === p).sort((a, b) => order(a.lines[0]) - order(b.lines[0]) || (a.id < b.id ? -1 : 1));
    const n = list.filter(s => state.stations[s.id]).length;
    return { title: `${p}の鉄道駅`, html: `<div class="sec-h">${cNum(n, list.length, '駅')}　タップで地図に表示</div>` +
      items(list.map(st => stationItem(st, lineChips(st)))) };
  },
  // 鉄道路線：JR線／私鉄／その他 の3つにまとめる（2026-11-27。分類は stations.json の lines[].kind）
  lines() {
    if (!STATIONS) return { title: '🚉 鉄道路線', html: '<div class="empty">駅データを読み込み中…</div>' };
    return { title: '🚉 鉄道路線', html:
      `<div class="list-note">いまは${esc(STATION_AREA || '一部の地域')}内の駅だけです（県をまたぐ路線は、その範囲の駅数）</div>` +
      LINE_KINDS.map(k => { const ls = LINES.filter(l => lineKind(l) === k.key);
        if (!ls.length) return '';
        const sts = [...new Set(ls.flatMap(l => l.st))];
        return statRow('lineGroup', k.key, esc(k.label), [
          { icon: '🏁', n: ls.filter(l => l.st.every(id => state.stations[id])).length, total: ls.length, unit: '路線', color: STAT_COLOR.station },
          { icon: '🚉', n: sts.filter(id => state.stations[id]).length, total: sts.length, unit: '駅', color: STAT_COLOR.station },
        ], k.note); }).join('') +
      '<div class="list-note">🏁＝全駅制覇した路線。乗換駅はそれぞれの分類に数えます</div>' };
  },
  // 分類ごとの路線の一覧
  lineGroup(kind) {
    if (!STATIONS) return { title: '🚉 鉄道路線', html: '<div class="empty">駅データを読み込み中…</div>' };
    const k = LINE_KINDS.find(x => x.key === kind) || LINE_KINDS[0];
    const ls = LINES.filter(l => lineKind(l) === k.key);
    return { title: k.label, html: (k.note ? `<div class="list-note">${esc(k.note)}</div>` : '') +
      ls.map(l => statRow('line', l.id, `${lineChip(l)}${esc(l.label)}`,
        [{ icon: '🚉', n: l.st.filter(id => state.stations[id]).length, total: l.st.length, unit: '駅', color: l.color }])).join('') };
  },
  line(id) {
    const l = lineIndex[id];
    if (!l) return { title: '路線', html: '<div class="empty">路線が見つかりません</div>' };
    const n = l.st.filter(s => state.stations[s]).length;
    return { title: l.label, html: `<div class="sec-h">${cNum(n, l.st.length, '駅')}　タップで地図に表示</div>` +
      items(l.st.map(sid => stationIndex[sid]).filter(Boolean).map(st => stationItem(st, esc(st.city || '')))) };
  },
  // お気に入り一覧（すべて／都道府県ごと）
  favs(filter) {
    filter = filter || 'all';
    const ids = Object.keys(state.favs).filter(id => spotById(id) || state.spots[id] || michiById(id) || state.michi[id]);
    // 複数県にまたがる観光地（三県境など）は、それぞれの県に出す
    const prefsOf = id => {
      if (isMichiId(id)) { const m = michiById(id), v = state.michi[id]; return [(m || v || {}).pref || 'その他']; }
      const s = spotById(id); return s ? spotPrefs(s) : [(state.spots[id] && state.spots[id].pref) || 'その他'];
    };
    const prefOf = id => prefsOf(id).join('・');
    const prefs = [...new Set(ids.flatMap(prefsOf))].sort((a, b) => prefRank(a) - prefRank(b));
    const chips = `<div class="chips"><button class="chip${filter === 'all' ? ' on' : ''}" data-filter="all">すべて（${ids.length}）</button>` +
      prefs.map(p => `<button class="chip${filter === p ? ' on' : ''}" data-filter="${esc(p)}">${esc(p)}（${ids.filter(id => prefsOf(id).includes(p)).length}）</button>`).join('') + '</div>';
    const shown = ids.filter(id => filter === 'all' || prefsOf(id).includes(filter)).sort((a, b) => state.favs[a] < state.favs[b] ? 1 : -1);
    if (!ids.length) return { title: '⭐ お気に入り一覧', html: '<div class="empty">お気に入りはまだありません。<br>観光地の詳細カードで「☆ お気に入り」を押すと登録できます。</div>' };
    return { title: '⭐ お気に入り一覧', html: chips + items(shown.map(id => {
      const mi = isMichiId(id);
      const s = mi ? michiById(id) : spotById(id), v = mi ? state.michi[id] : state.spots[id];
      const t = mi ? MICHI_TYPE : spotType(s), name = s ? s.name : v.name, city = s ? s.city : (v.city || '');
      return item({ mark: '<span style="color:#f0b400">★</span>', attrs: `data-spot="${esc(id)}"`,
        name: `${t.icon} ${esc(name)}${v && v.memo ? ' 📝' : ''}${mi ? '' : bestBadge(v)}`,
        sub: esc(`${prefOf(id)} ${city}`.trim() + `・登録 ${state.favs[id]}`),
        right: v ? `✅ 訪問済み<br>${v.count}回` : '未訪問' });
    })) };
  },
  // 最近の訪問（チェックインの新しい順）
  recent(filter) {
    filter = filter || 'all';
    const kinds = [['all', 'すべて'], ['muni', '🏙️ 市町村'], ['spot', '📍 観光地'], ['station', '🚉 駅'], ['michi', '🚗 道の駅']];
    const chips = '<div class="chips">' + kinds.map(([k, label]) =>
      `<button class="chip${filter === k ? ' on' : ''}" data-filter="${k}">${label}</button>`).join('') + '</div>';
    const log = state.log.map((e, i) => Object.assign({ i }, e))
      .filter(e => filter === 'all' || e.type === filter)
      .sort((a, b) => a.at < b.at ? 1 : a.at > b.at ? -1 : b.i - a.i).slice(0, 200);
    if (!log.length) return { title: '🕒 最近の訪問', html: chips + '<div class="empty">まだチェックインの記録がありません</div>' };
    let html = chips, day = '';
    const rows = [];
    const flush = () => { if (rows.length) { html += items(rows.splice(0)); } };
    log.forEach(e => {
      const d = e.at.slice(0, 10);
      if (d !== day) { flush(); day = d; html += `<div class="sec-h">${fmtDay(d)}</div>`; }
      const s = e.type === 'spot' ? spotById(e.id) : null;
      const icon = e.type === 'muni' ? '🏙️' : e.type === 'station' ? '🚉' : e.type === 'michi' ? MICHI_TYPE.icon : spotType(s).icon;
      const label = e.type === 'muni' ? '市町村' : e.type === 'station' ? '駅' : e.type === 'michi' ? MICHI_TYPE.label : spotType(s).label;
      const attrs = (e.type === 'spot' || e.type === 'michi') ? `data-spot="${esc(e.id)}"` : e.type === 'station' ? `data-station="${esc(e.id)}"` : '';
      rows.push(item({ mark: icon, attrs, name: esc(e.name) + (e.type === 'station' ? '駅' : ''),
        sub: esc([label, e.pref].filter(Boolean).join('・')),
        right: (e.at.length > 10 ? e.at.slice(11, 16) : '時刻不明') + (typeof e.xp === 'number' ? `<br>+${e.xp} XP` : '') +
          (e.medal ? `<br>${medalBadge(e.medal)}` : '') }));
    });
    flush();
    if (log.some(e => e.at.length <= 10)) html += '<div class="list-note">※ 履歴の機能を入れる前の訪問は、最後に訪問した日だけを表示しています</div>';
    return { title: '🕒 最近の訪問', html };
  },
  // 獲得メダル：種類ごとの枚数（入手したメダル全部）と、観光地ごとのベストメダルの一覧（RATE の小さい順）
  // filter = 'all' ／ 'platinum' 'gold' 'silver' 'bronze'（ベストメダルの種類で絞り込む）
  medals(filter) {
    filter = filter || 'all';
    const all = Object.entries(state.spots).flatMap(([id, v]) => medalsOf(v).map(m => ({ id, r: m.r })));
    const spots = Object.entries(state.spots).map(([id, v]) => ({ id, v, best: bestMedal(v) })).filter(x => x.best !== null);
    if (!all.length) return { title: '🏅 獲得メダル', html: '<div class="empty">まだメダルがありません。<br>観光地にチェックインすると、RATE 1〜99 のメダルを1枚入手できます。<br>数字が小さいほどレアで、同じ観光地に何度も行くほどレアなメダルが出やすくなります。</div>' +
      medalHelp() };
    const sum = MEDAL_TIERS.map(t => { const n = all.filter(m => medalTier(m.r) === t).length;
      const lo = { platinum: 1, gold: 10, silver: 30, bronze: 60 }[t.key];
      return `<div class="ms-cell${n ? '' : ' zero'}"><span class="medal big m-${t.key}"></span>` +
        `<div class="ms-label">${t.label}</div><div class="ms-range">RATE ${lo}〜${t.max}</div><div class="ms-num">${n}<small>枚</small></div></div>`; }).join('');
    const top = Math.min(...all.map(m => m.r));
    const chips = '<div class="chips">' + [['all', `すべて（${spots.length}）`]].concat(MEDAL_TIERS.map(t =>
      [t.key, `${t.label}（${spots.filter(x => medalTier(x.best) === t).length}）`])).map(([k, label]) =>
      `<button class="chip${filter === k ? ' on' : ''}" data-filter="${k}">${label}</button>`).join('') + '</div>';
    const shown = spots.filter(x => filter === 'all' || medalTier(x.best).key === filter)
      .sort((a, b) => a.best - b.best || medalsOf(b.v).length - medalsOf(a.v).length);
    const rows = shown.map(({ id, v, best }) => { const s = spotById(id), t = spotType(s);
      return item({ mark: medalBadge(best), attrs: `data-spot="${esc(id)}"`, name: `${t.icon} ${esc(s ? s.name : v.name)}${s && s.rare ? ' ✨' : ''}`,
        sub: esc([`ベスト ${medalName(best)} RATE ${best}`, s ? spotPrefs(s).join('・') : v.pref].filter(Boolean).join('・')),
        right: `${medalsOf(v).length}枚<br>${v.count}回` }); });
    return { title: '🏅 獲得メダル', html:
      `<div class="medal-sum">${sum}</div>` +
      `<div class="list-note">入手したメダル 全${all.length}枚・メダルのある観光地 ${spots.length}か所・一番レアなメダル RATE ${top}</div>` +
      `<div class="sec-h">観光地ごとのベストメダル</div>` + chips + (rows.length ? items(rows) : '<div class="empty">この種類のメダルはまだありません</div>') +
      medalHelp() };
  },
  // 検索（観光地・道の駅・鉄道駅を名前の一部で探す）。入力欄はそのままにして、結果（#searchResults）だけ作り直す
  search(q) {
    return { title: '🔍 検索', html:
      `<div class="search-box"><input id="searchInput" type="search" placeholder="名前や市町村名の一部（例：松本、温泉）" ` +
      `value="${esc(q || '')}" enterkeyhint="search" autocomplete="off" aria-label="検索する言葉"></div>` +
      `<div id="searchResults">${searchResultsHtml(q)}</div>` };
  },
  // 記録の管理（保存・読み込み・リセット）
  manage() { renderBackupInfo(); return { title: '💾 記録の管理', html: '' }; },
};

// メダルのしくみの説明（獲得メダルのページの下）
const medalHelp = () => '<div class="list-note medal-help">🏅 観光地にチェックインするたびにメダルを1枚入手（1日1回）。RATE は 1〜99 で、数字が小さいほどレア。<br>' +
  'プラチナ 1〜9／金 10〜29／銀 30〜59／銅 60〜99。<br>1回目は 1〜99、2回目は 1〜79、3回目以降は 1〜49 から抽選するので、同じ観光地に何度も行くほどレアなメダルが出やすくなります。</div>';

// 鉄道路線の分類（2026-11-27 にユーザーと決めた）：JR（新幹線・在来線）／私鉄（民営と第三セクター）／その他（ケーブルカーなど）
const LINE_KINDS = [
  { key: 'jr', label: '🚆 JR線', note: '' },
  { key: 'private', label: '🚃 私鉄', note: '東武・西武などの民営の鉄道と、しなの鉄道・つくばエクスプレスなどの第三セクターの鉄道' },
  { key: 'other', label: '🚋 その他', note: 'ケーブルカーなど' },
];
// stations.json に kind が無い古いデータは、id が jr- で始まれば JR線、それ以外は私鉄として扱う
const lineKind = l => l.kind || (l.id.startsWith('jr-') ? 'jr' : 'private');

// ===== 検索 =====
// 比べるための形にそろえる：全角・半角をそろえ、カタカナはひらがなに、大文字は小文字に、空白は取る
const normQ = s => String(s || '').normalize('NFKC').toLowerCase()
  .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, '');
const SEARCH_MAX = 100; // 種類ごとに出す最大件数
function searchResultsHtml(q) {
  const nq = normQ(q);
  if (!nq) return '<div class="empty">観光地・道の駅・鉄道駅を、名前の一部で探せます。<br>市町村名でも探せます（例：「軽井沢」「高崎」）。<br>ひらがな・カタカナは区別しません。</div>';
  // 名前に入っているものを先に、その中では名前の先頭が合うもの → 都道府県の順（北から）→ 名前の順
  const score = (name, city) => { const n = normQ(name); return n.startsWith(nq) ? 0 : n.includes(nq) ? 1 : normQ(city).includes(nq) ? 2 : -1; };
  const pick = (list, nameOf) => list.map(x => ({ x, s: score(nameOf(x), x.city) })).filter(o => o.s >= 0)
    .sort((a, b) => a.s - b.s || prefRank(a.x.pref) - prefRank(b.x.pref) || (nameOf(a.x) < nameOf(b.x) ? -1 : 1)).map(o => o.x);
  const more = n => n > SEARCH_MAX ? `<div class="list-note">ほか ${n - SEARCH_MAX} 件。もう少し詳しく入力すると絞り込めます</div>` : '';
  const sec = (title, list, row) => `<div class="sec-h">${title}（${list.length}件）</div>` +
    (list.length ? items(list.slice(0, SEARCH_MAX).map(row)) + more(list.length) : '<div class="list-note">見つかりませんでした</div>');
  const spots = pick(SPOTS, s => s.name);
  const michi = pick(MICHI.filter(m => !m.spot), m => m.name); // 観光地を兼ねる道の駅は観光地の方に出る
  const sts = STATIONS ? pick(STATIONS, s => s.name + '駅') : null;
  const spotRow = s => { const v = state.spots[s.id], t = spotType(s);
    return item({ mark: v ? '✅' : '・', todo: !v, attrs: `data-spot="${esc(s.id)}"`,
      name: `${t.icon} ${esc(s.name)}${s.rare ? ' ✨' : ''}${s.michi ? ' 🚗' : ''}${state.favs[s.id] ? ' <span style="color:#f0b400">★</span>' : ''}${bestBadge(v)}`,
      sub: esc([t.label, spotPrefs(s).join('・'), s.city].filter(Boolean).join('・')), right: visitRight(v) }); };
  const michiRow = m => { const v = state.michi[m.id];
    return item({ mark: v ? '✅' : '・', todo: !v, attrs: `data-spot="${esc(m.id)}"`,
      name: `🚗 ${esc(m.name)}${state.favs[m.id] ? ' <span style="color:#f0b400">★</span>' : ''}`,
      sub: esc([m.pref, m.city].filter(Boolean).join('・')), right: visitRight(v) }); };
  const stRow = st => stationItem(st, esc([st.pref, st.city].filter(Boolean).join('・')) + '<div>' + lineChips(st) + '</div>');
  return sec('📍 観光地', spots, spotRow) + sec('🚗 道の駅', michi, michiRow) +
    (sts ? sec('🚉 鉄道駅', sts, stRow) : '<div class="sec-h">🚉 鉄道駅</div><div class="list-note">駅データを読み込み中…</div>');
}
let searchTimer = 0;
$('pageBody').addEventListener('input', e => {
  if (e.target.id !== 'searchInput') return;
  const top = pageStack[pageStack.length - 1];
  if (top && top.name === 'search') top.arg = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const r = $('searchResults'); if (r) r.innerHTML = searchResultsHtml(e.target.value); }, 150);
});
// Enter（スマホのキーボードの「検索」）でキーボードを閉じて結果を見やすくする
$('pageBody').addEventListener('keydown', e => { if (e.target.id === 'searchInput' && e.key === 'Enter') e.target.blur(); });

// ===== ページの移動（スマホの「戻る」でも1つ前に戻れるよう、履歴に積む） =====
let pageStack = [];  // [{ name, arg, scroll }]
function renderPage(keepScroll) {
  const top = pageStack[pageStack.length - 1];
  if (!top) return;
  const body = $('pageBody'), sc = body.scrollTop;
  // 検索ページは、入力中に記録や駅データが変わっても入力欄を作り直さない（キーボードが閉じないように）。結果だけ更新する
  if (top.name === 'search' && $('searchResults') && body.contains($('searchResults')) && !body.hidden) {
    $('searchResults').innerHTML = searchResultsHtml(top.arg);
    if (keepScroll) body.scrollTop = sc;
    return;
  }
  const v = VIEWS[top.name](top.arg);
  $('pageTitle').textContent = v.title;
  const manage = top.name === 'manage';
  $('manageBox').hidden = !manage;
  body.hidden = manage;
  if (!manage) body.innerHTML = v.html;
  if (keepScroll) body.scrollTop = sc;
}
function openPage(name) {
  closeDrawer();
  pageStack = [{ name }];
  $('page').hidden = false;
  history.pushState({ tabilogPage: 1 }, '');
  if (name === 'complete' || name === 'search') loadStations();
  if (name === 'search') $('pageBody').innerHTML = ''; // 前の検索ページの入力欄を使い回さない
  renderPage();
  $('pageBody').scrollTop = 0;
  if (name === 'search') setTimeout(() => { const i = $('searchInput'); if (i) i.focus(); }, 50);
}
function pushPage(name, arg) {
  pageStack[pageStack.length - 1].scroll = $('pageBody').scrollTop;
  pageStack.push({ name, arg });
  history.pushState({ tabilogPage: pageStack.length }, '');
  renderPage();
  $('pageBody').scrollTop = 0;
}
// 戻る（←ボタン・スマホの戻る）：履歴の深さに合わせてページを閉じる
window.addEventListener('popstate', e => {
  const depth = (e.state && e.state.tabilogPage) || 0;
  if (pageStack.length <= depth) return;
  pageStack.length = depth;
  if (!depth) { $('page').hidden = true; return; }
  renderPage();
  $('pageBody').scrollTop = pageStack[depth - 1].scroll || 0;
});
$('pageBack').addEventListener('click', () => history.back());
$('pageClose').addEventListener('click', () => { if (pageStack.length) history.go(-pageStack.length); });
$('pageBody').addEventListener('click', e => {
  const el = e.target.closest('[data-nav],[data-spot],[data-station],[data-filter]');
  if (!el) return;
  if (el.dataset.nav) pushPage(el.dataset.nav, el.dataset.arg);
  else if (el.dataset.spot) openSpotDetail(el.dataset.spot);
  else if (el.dataset.station) {
    const s = stationIndex[el.dataset.station];
    if (!s) return;
    if (pageStack.length) history.go(-pageStack.length); // ページを閉じて地図でその駅を表示
    map.setView([s.lat, s.lng], Math.max(map.getZoom(), 15));
  } else if (el.dataset.filter) { pageStack[pageStack.length - 1].arg = el.dataset.filter; renderPage(true); }
});

// 記録の置き場所：観光地は state.spots、道の駅は state.michi
const recStore = id => isMichiId(id) ? state.michi : state.spots;
function openSpotDetail(id) {
  const isM = isMichiId(id);
  if (isM && michiById(id) && michiById(id).spot) return openSpotDetail(michiById(id).spot); // 観光地を兼ねる道の駅は観光地のカード
  const s = isM ? michiById(id) : spotById(id), v = recStore(id)[id];
  if (!s && !v) return;
  const t = isM ? MICHI_TYPE : spotType(s);
  $('dIcon').textContent = isM ? '道' : t.icon;
  $('dIcon').className = (isM ? 'detail-icon michi' : 'detail-icon t-' + ((s && s.type) || 'other') + (s && s.rare ? ' rare' : '')) +
    (v ? ' visited' : ''); // チェックイン済みなら地図の印と同じ黄緑のふち
  $('dName').textContent = s ? s.name : v.name;
  const pref = s ? (isM ? s.pref : spotPrefs(s).join('・')) : (v && v.pref) || '', city = (s && s.city) || (v && v.city) || '';
  $('dType').textContent = [s && s.rare ? '✨ レアスポット' : '', t.label, s && s.michi ? '🚗 道の駅' : '', (pref + ' ' + city).trim()]
    .filter(Boolean).join('・');
  $('dDesc').textContent = SPOT_DESC[id] || '説明はまだありません。';
  // 世界遺産（spots.json の wh: { type: 'culture' | 'nature', name: 世界遺産の名前 }）

    $('dWh').textContent = `${nature ? '🌳 世界自然遺産' : '🏛️ 世界文化遺産'}「${wh.name}」`;
  }

// 詳細カードのメダル欄：ベスト（大きな丸）・入手したメダル（RATE の小さい順）・次の訪問で抽選する範囲
function renderDetailMedal(isM, v) {
  const box = $('dMedal');
  box.hidden = isM;
  if (isM) return;
  const ms = medalsOf(v).slice().sort((a, b) => a.r - b.r);
  const next = medalRange((v ? v.count : 0) + 1);
  const nextText = `次のチェックインは RATE 1〜${next} から抽選${v && v.last === today() ? '（明日から）' : ''}`;
  if (!ms.length) {
    box.innerHTML = '<div class="dm-head">🏅 メダル</div><div class="dm-none">' +
      (v ? 'まだありません（メダル機能を入れる前の訪問のため）' : 'チェックインするとメダルを1枚入手できます') +
      `</div><div class="dm-next">${nextText}</div>`;
    return;
  }
  const best = ms[0].r, cnt = MEDAL_TIERS.map(t => [t, ms.filter(m => medalTier(m.r) === t).length]).filter(x => x[1]);
  box.innerHTML = '<div class="dm-head">🏅 メダル</div>' +
    `<div class="dm-best">${medalBadge(best, 'big')}<div><div class="dm-best-name">ベスト：${medalName(best)}</div>` +
    `<div class="dm-best-rate">RATE ${best}</div></div></div>` +
    `<div class="dm-count">全${ms.length}枚（${cnt.map(([t, n]) => `${t.label}${n}`).join('・')}）</div>` +
    `<div class="dm-list">${ms.map(m => medalBadge(m.r)).join('')}</div>` +
    `<div class="dm-next">${nextText}</div>`;
}

const michiXp = v => v ? XP_MICHI_NEW + (v.count - 1) * XP_MICHI_REVISIT : 0;

// HTMLに埋め込む文字のエスケープ（読み込んだファイルやOSMの名前に記号が入っていても安全にする）

}
