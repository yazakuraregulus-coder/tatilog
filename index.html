// バックアップファイルの中身を確かめて、記録の形に整える（おかしければ例外）
function parseBackup(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('たびログの記録ファイルではありません'); }
  if (!j || typeof j.xp !== 'number' || !(j.xp >= 0) || typeof j.visited !== 'object' || j.visited === null) {
    throw new Error('たびログの記録ファイルではありません');
  }
  const visited = {};
  for (const v of Object.values(j.visited)) {
    const ok = v && ['pref', 'city', 'first', 'last'].every(f => typeof v[f] === 'string') && typeof v.count === 'number';
    if (!ok) throw new Error('記録の形式が正しくありません');
    visited[v.pref + '/' + v.city] = { pref: v.pref, city: v.city, first: v.first, last: v.last, count: v.count };
  }
  // 観光地の記録（観光地機能より前に保存したファイルには無い）
  const spots = {};
  if (j.spots !== undefined) {
    if (typeof j.spots !== 'object' || j.spots === null) throw new Error('記録の形式が正しくありません');
    for (const [id, v] of Object.entries(j.spots)) {
      const ok = v && ['name', 'first', 'last'].every(f => typeof v[f] === 'string') && typeof v.count === 'number';
      if (!ok) throw new Error('観光地の記録の形式が正しくありません');
      spots[id] = { name: v.name, pref: typeof v.pref === 'string' ? v.pref : '', first: v.first, last: v.last, count: v.count };
      if (typeof v.city === 'string') spots[id].city = v.city;
      if (typeof v.memo === 'string' && v.memo) spots[id].memo = v.memo.slice(0, 500);
      // メダル（メダル機能より前のファイルには無い）。RATE が 1〜99 の整数のものだけ残す
      if (Array.isArray(v.medals)) {
        const ms = v.medals.filter(m => m && Number.isInteger(m.r) && m.r >= 1 && m.r <= 99 && typeof m.d === 'string').map(m => ({ r: m.r, d: m.d }));
        if (ms.length) spots[id].medals = ms;
      }
    }
  }
  // 駅の記録（駅機能より前に保存したファイルには無い）
  const stations = {};
  if (j.stations !== undefined) {
    if (typeof j.stations !== 'object' || j.stations === null) throw new Error('記録の形式が正しくありません');
    for (const [id, v] of Object.entries(j.stations)) {
      const ok = v && ['name', 'first', 'last'].every(f => typeof v[f] === 'string') && typeof v.count === 'number';
      if (!ok) throw new Error('駅の記録の形式が正しくありません');
      stations[id] = { name: v.name, pref: typeof v.pref === 'string' ? v.pref : '', city: typeof v.city === 'string' ? v.city : '',
        first: v.first, last: v.last, count: v.count };
    }
  }
  // 道の駅の記録（道の駅機能より前に保存したファイルには無い）
  const michi = {};
  if (j.michi !== undefined) {
    if (typeof j.michi !== 'object' || j.michi === null) throw new Error('記録の形式が正しくありません');
    for (const [id, v] of Object.entries(j.michi)) {
      const ok = v && ['name', 'first', 'last'].every(f => typeof v[f] === 'string') && typeof v.count === 'number';
      if (!ok) throw new Error('道の駅の記録の形式が正しくありません');
      michi[id] = { name: v.name, pref: typeof v.pref === 'string' ? v.pref : '', city: typeof v.city === 'string' ? v.city : '',
        first: v.first, last: v.last, count: v.count };
      if (typeof v.memo === 'string' && v.memo) michi[id].memo = v.memo.slice(0, 500);
    }
  }
  // お気に入り（{ 観光地・道の駅のid: 登録日 }）と履歴（無ければ今までの記録から作る）
  const favs = {};
  if (j.favs && typeof j.favs === 'object') {
    for (const [id, d] of Object.entries(j.favs)) if (typeof d === 'string') favs[id] = d;
  }
  const s = { xp: Math.floor(j.xp), visited, spots, stations, michi, favs };
  s.log = Array.isArray(j.log)
    ? j.log.filter(e => e && ['muni', 'spot', 'station', 'michi'].includes(e.type) && typeof e.id === 'string' &&
        typeof e.name === 'string' && typeof e.at === 'string').slice(-LOG_MAX)
        .map(e => Object.assign({ type: e.type, id: e.id, name: e.name, pref: typeof e.pref === 'string' ? e.pref : '', at: e.at,
          xp: typeof e.xp === 'number' ? e.xp : undefined }, Number.isInteger(e.medal) && e.medal >= 1 && e.medal <= 99 ? { medal: e.medal } : {}))
    : legacyLog(s);
  return s;
}

let toastTimer;

}

  document.body.classList.toggle('demo', demo);
  $('demo').classList.toggle('on', demo);
  $('demo').textContent = demo ? '🧪 テスト終了' : '🧪 テストモード';
  if (demo) { stopWatch(); $('sub').textContent = '地図をタップしてください'; }
  else startWatch();
  setTimeout(() => map.invalidateSize(), 50);
}
// テストモードは ☰ メニューから開始・終了（テスト中は赤い帯の「終了」でも終われる）
$('demo').addEventListener('click', () => { closeDrawer(); toggleDemo(); });
$('demoEnd').addEventListener('click', () => { if (demo) toggleDemo(); });
map.on('click', e => { if (demo) setPosition(e.latlng.lat, e.latlng.lng, 0, true); });
$('reset').addEventListener('click', () => {
  if (confirm('経験値と訪問記録をすべて消します。よろしいですか？')) {
    state = { xp: 0, visited: {}, spots: {}, stations: {}, michi: {}, favs: {}, log: [] }; save(); render();
  }
});

render();
renderBackupInfo();
loadSpots();
startWatch();
// 日付が変わったら描き直す（「今日訪問した」半透明の表示や「今日はチェックイン済み」を元に戻すため。止まっていてGPSの更新が無いときのため）
let shownDay = today();
setInterval(() => { if (today() !== shownDay) { shownDay = today(); listDirty = true; render(); } }, 60000);
</script>
</body>
</html>
